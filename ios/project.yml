# XcodeGen spec. Run `xcodegen generate` here to get CheckPrice.xcodeproj. Builds the app plus the
# widget extension (the check's Live Activity / Dynamic Island, in Widget/), embedded in the app.
# Unsigned, so simulators and cloud devices can build it without a team.
name: CheckPrice
options:
  bundleIdPrefix: com.ycconsumerhackathon
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: NO
    # The app and its extension must carry the same version numbers.
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  CheckPrice:
    type: application
    platform: iOS
    # Everything under CheckPrice/ compiles: Models, Screens, Components, DesignSystem, LiveActivity.
    # Shared/ holds the Live Activity state, compiled into both targets.
    sources: [CheckPrice, Shared]
    dependencies:
      - target: CheckPriceWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ycconsumerhackathon.checkprice
        PRODUCT_NAME: Check Price
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Check Price
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
    scheme: {}
  CheckPriceWidgets:
    type: app-extension
    platform: iOS
    sources: [Widget, Shared]
    info:
      path: Generated/Widgets-Info.plist
      properties:
        CFBundleDisplayName: Check Price
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ycconsumerhackathon.checkprice.widgets
        TARGETED_DEVICE_FAMILY: "1,2"
