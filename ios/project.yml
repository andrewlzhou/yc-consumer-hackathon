# XcodeGen spec. Run `xcodegen generate` here to get CheckPrice.xcodeproj. Builds the app plus the
# widget extension (the check's Live Activity / Dynamic Island, in Widget/), embedded in the app.
# Unsigned, so simulators and cloud devices can build it without a team.
name: CheckPrice
options:
  bundleIdPrefix: com.ycconsumerhackathon
  deploymentTarget:
    iOS: "18.0"
# ShopperKit: the backend client, contract models and on-device screenshot reading (with tests).
packages:
  ShopperKit:
    path: ShopperKit
settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: NO
    # The app and its extension must carry the same version numbers.
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  CheckPrice:
    type: application
    platform: iOS
    # Everything under CheckPrice/ compiles: Models, Screens, Components, DesignSystem, LiveActivity.
    # Shared/ holds the Live Activity state, compiled into both targets.
    sources: [CheckPrice, Shared]
    dependencies:
      - target: CheckPriceWidgets
        embed: true
      - package: ShopperKit
        product: ShopperKit
    # Backend address and key (Config/*.xcconfig) reach the app through these Info.plist keys.
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    info:
      path: Generated/CheckPrice-Info.plist
      properties:
        CheckPriceBackendHost: $(CHECKPRICE_BACKEND_HOST)
        CheckPriceAPIKey: $(CHECKPRICE_API_KEY)
        # checkprice://product/<productId> opens that product's thread (CheckPrice/Intents/ProductLink.swift).
        CFBundleURLTypes:
          - CFBundleURLName: com.ycconsumerhackathon.checkprice
            CFBundleURLSchemes: [checkprice]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ycconsumerhackathon.checkprice
        PRODUCT_NAME: Check Price
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Check Price
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
    scheme:
      testTargets: [CheckPriceTests]
  # Unit tests for the app's own logic, hosted in the app (the app module is Check_Price).
  CheckPriceTests:
    type: bundle.unit-test
    platform: iOS
    sources: [CheckPriceTests]
    dependencies:
      - target: CheckPrice
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.ycconsumerhackathon.checkprice.tests
        # The app's product name has a space, so XcodeGen's default host path is wrong.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Check Price.app/Check Price"
        BUNDLE_LOADER: "$(TEST_HOST)"
  CheckPriceWidgets:
    type: app-extension
    platform: iOS
    sources: [Widget, Shared]
    info:
      path: Generated/Widgets-Info.plist
      properties:
        CFBundleDisplayName: Check Price
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ycconsumerhackathon.checkprice.widgets
        TARGETED_DEVICE_FAMILY: "1,2"
