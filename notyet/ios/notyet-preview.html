<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Not Yet preview</title>
<!--
  Browser preview of the Not Yet iPhone app in the Worldscape design language. Each block names the Swift
  view it mirrors; values come from Views/DesignSystem/*.swift and the screen files. Change the Swift first,
  then this file. Sample data is App/SampleData.swift (mock keys a-e). There is no Xcode on the machine this
  was built on, so this is how the screens were checked by eye; it is an approximation, not a render of the
  SwiftUI code (SF Symbols, Swift Charts, materials and MeshGradient are hand-drawn stand-ins).
  ?bare shows the phone alone at 402x874 (for screenshots); ?state=<name> opens a state (see show()).
-->
<style>
  /* Hiragino Sans by PostScript name (macOS has W0-W9; the iPhone may only have W3/W6/W7). */
  @font-face { font-family: "HS"; font-weight: 400; src: local("HiraginoSans-W4"), local("Hiragino Sans W4"); }
  @font-face { font-family: "HS"; font-weight: 500; src: local("HiraginoSans-W5"), local("Hiragino Sans W5"); }
  @font-face { font-family: "HS"; font-weight: 600; src: local("HiraginoSans-W6"), local("Hiragino Sans W6"); }

  :root { color-scheme: dark; --page-bg: #0c0d10; --page-ink: #eef1f5; --page-muted: #8b93a1; --page-line: #262a31; }
  :root[data-theme="light"] { color-scheme: light; --page-bg: #e9ebef; --page-ink: #14181f; --page-muted: #5b6474; --page-line: #cfd4dc; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --page-bg: #0c0d10; } }
  :root[data-theme="dark"] { --page-bg: #0c0d10; }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--page-bg); color: var(--page-ink);
    font-family: "HS", "Hiragino Sans", -apple-system, BlinkMacSystemFont, system-ui, sans-serif; }
  .stage { min-height: 100%; display: flex; align-items: center; justify-content: center; gap: 32px; padding: 20px; flex-wrap: wrap; }
  .controls { width: 236px; display: flex; flex-direction: column; gap: 6px; max-height: calc(100vh - 40px); overflow-y: auto; }
  .controls h1 { font: 600 22px/1.1 "HS", "Hiragino Sans", system-ui; letter-spacing: -0.6px; margin: 0 0 4px; }
  .controls p { margin: 10px 0 0; font-size: 12px; letter-spacing: .3px; color: var(--page-muted); }
  .controls button { font: 400 13px/1 "HS", "Hiragino Sans", system-ui; text-align: left; padding: 9px 11px; border: 1px solid var(--page-line);
    border-radius: 8px; background: transparent; color: var(--page-ink); cursor: pointer; }
  .controls button:hover { border-color: var(--page-muted); }
  .controls button:focus-visible, .phone button:focus-visible, .phone input:focus-visible { outline: 2px solid #436FFF; outline-offset: 2px; }
  .phone-wrap { position: relative; }
  .phone-scale { transform-origin: top left; }
  body.bare .controls { display: none; }
  body.bare .stage { padding: 0; display: block; min-height: 0; }
  body.bare .phone { border-radius: 0; box-shadow: none; }

  /* ===== Phone: dark only (Palette.swift) ===== */
  .phone {
    --canvas: #010101; --electric: #005EFF; --iris: #4A56FF; --ultramarine: #1500FF; --glow: #436FFF;
    --t1: rgba(255,255,255,.94); --t2: rgba(255,255,255,.62); --t3: rgba(255,255,255,.36);
    --stroke: rgba(255,255,255,.16); --stroke-hover: rgba(255,255,255,.24); --divider: rgba(255,255,255,.06);
    --fill-card: rgba(255,255,255,.03); --fill-row: rgba(255,255,255,.05); --fill-chip: rgba(255,255,255,.10); --fill-chip-p: rgba(255,255,255,.16);
    --danger: #FF5C7A; --buy: #3DDC97; --wait: #FFB547;
    position: relative; width: 402px; height: 874px; background: var(--canvas); color: var(--t1);
    border-radius: 56px; overflow: hidden; box-shadow: 0 0 0 10px #17181b, 0 0 0 11px #34363b, 0 30px 60px rgba(0,0,0,.4);
    font-family: "HS", "Hiragino Sans", -apple-system, system-ui, sans-serif; font-weight: 400; line-height: 1;
    -webkit-font-smoothing: antialiased;
  }
  :where(.phone) button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
  :where(.phone) input { font: inherit; }
  .sf { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; }

  /* Type roles (Typography.swift, iOS sizes). Hiragino sets at 1.0 line height; .ls-N adds lineSpacing N. */
  .t-title   { font-weight: 600; font-size: 28px; letter-spacing: -0.4px; }
  .t-card    { font-weight: 600; font-size: 16px; letter-spacing: -0.1px; }
  .t-body    { font-weight: 400; font-size: 16px; }
  .t-button  { font-weight: 500; font-size: 16px; letter-spacing: 0.2px; }
  .t-item    { font-weight: 400; font-size: 15px; }
  .t-label   { font-weight: 400; font-size: 14px; letter-spacing: 0.1px; }
  .t-caption { font-weight: 400; font-size: 13px; letter-spacing: 0.1px; }
  .t-section { font-weight: 400; font-size: 12px; letter-spacing: 0.3px; }
  .t-foot    { font-weight: 400; font-size: 12px; letter-spacing: 0.1px; }
  .w6 { font-weight: 600; }
  .ls-3 { line-height: calc(1em + 3px); } .ls-4 { line-height: calc(1em + 4px); } .ls-5 { line-height: calc(1em + 5px); }
  .ls-6 { line-height: calc(1em + 6px); } .ls-8 { line-height: calc(1em + 8px); }
  .c1 { color: var(--t1); } .c2 { color: var(--t2); } .c3 { color: var(--t3); }
  .num { font-variant-numeric: tabular-nums; }
  .ell { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.3; margin: -2px 0; }
  .row { display: flex; align-items: center; }
  .stack { display: flex; flex-direction: column; }
  .grow { flex: 1; min-width: 0; }

  /* Status bar, nav bar, layout */
  .status { position: absolute; top: 0; left: 0; right: 0; height: 54px; display: flex; justify-content: space-between;
    align-items: center; padding: 0 34px 0 48px; font: 600 17px/1 -apple-system, system-ui; z-index: 60; pointer-events: none; color: #fff; }
  .status .icons { display: flex; gap: 6px; align-items: center; }
  .screen { position: absolute; inset: 0; padding-top: 54px; display: flex; flex-direction: column; }
  .screen > .bg { position: absolute; inset: 0; pointer-events: none; }
  .nav { position: relative; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; height: 52px; flex: none; }
  .scroll { position: relative; flex: 1; overflow-y: auto; overflow-x: hidden; padding-bottom: 120px; }
  .scroll::-webkit-scrollbar { width: 0; }
  .pad { padding: 0 16px; }
  .hairline { height: 1px; background: var(--divider); flex: none; }

  /* iOS 26 toolbar items: system glass, drawn by iOS */
  .bar-btn { min-width: 44px; height: 44px; padding: 0 12px; border-radius: 22px; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    color: var(--t1); background: rgba(255,255,255,.08); box-shadow: inset 0 0 0 .5px rgba(255,255,255,.16), 0 4px 14px rgba(0,0,0,.3);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); font: 500 17px/1 -apple-system, system-ui; }

  /* ===== Keys (Keys.swift) ===== */
  .key { position: relative; display: block; width: 100%; height: 52px; }
  .key .base { position: absolute; left: 0; right: 0; top: 2px; height: 50px; border-radius: 10px;
    background: linear-gradient(#0048CC, #00309A);
    box-shadow: 0 1px 2px rgba(0,0,0,.45), 0 4px 12px rgba(0,0,0,.3), 0 6px 24px rgba(0,94,255,.2); transition: box-shadow .3s; }
  .key .face { position: absolute; left: 0; right: 0; top: 0; height: 50px; border-radius: 10px; overflow: hidden;
    display: flex; align-items: center; justify-content: center; color: #fff;
    background: linear-gradient(rgba(255,255,255,.1), rgba(255,255,255,0) 50%), linear-gradient(#2A78FF, #005EFF 50%, #0052E3);
    box-shadow: inset 1px 5px 5.4px #1B6FFF, inset 0 -1.5px 5px rgba(0,26,107,.32);
    transition: transform .3s cubic-bezier(.3,1.4,.5,1), box-shadow .3s; }
  .key .face span { font-weight: 500; font-size: 16px; letter-spacing: .2px; text-shadow: 0 1px 2px rgba(0,0,0,.22); white-space: nowrap; }
  .key:active .face { transform: translateY(2px); transition-duration: .07s; transition-timing-function: ease-out;
    box-shadow: inset 1px 5px 5.4px #1B6FFF, inset 0 -1.5px 5px rgba(0,26,107,.32), inset 0 2px 6px rgba(0,0,0,.36); }
  .key:active .base { box-shadow: 0 .5px 1px rgba(0,0,0,.45), 0 .5px 3px rgba(0,0,0,.18), 0 1px 8px rgba(0,94,255,.1); transition-duration: .07s; }
  .key[disabled], .quiet[disabled] { opacity: .5; cursor: default; }
  .key.working .face span { opacity: 0; }

  .skey { position: relative; display: inline-block; height: 44px; padding: 3.25px 0; }
  .skey .base { position: absolute; left: 0; right: 0; top: 4.75px; height: 36px; border-radius: 8px; background: #111114; box-shadow: 0 2px 6px rgba(0,0,0,.55); }
  .skey .face { position: relative; height: 36px; padding: 0 14px; border-radius: 8px; display: flex; align-items: center; gap: 6px; color: var(--t1);
    background: linear-gradient(#34343A, #24242A); box-shadow: inset 0 1px 1.2px rgba(255,255,255,.14), inset 0 0 0 1px rgba(255,255,255,.06);
    transition: transform .3s cubic-bezier(.3,1.4,.5,1); }
  .skey .face span { font-weight: 500; font-size: 13px; letter-spacing: .2px; white-space: nowrap; }
  .skey:active .face { transform: translateY(1.5px); transition: transform .07s ease-out; }

  .quiet { position: relative; display: flex; width: 100%; height: 50px; border-radius: 10px; align-items: center; justify-content: center;
    box-shadow: inset 0 0 0 1px var(--stroke); color: var(--t2); font-weight: 500; font-size: 16px; letter-spacing: .2px; transition: all .15s ease-out; }
  .quiet:active { box-shadow: inset 0 0 0 1px var(--stroke-hover); background: rgba(255,255,255,.04); color: var(--t1); }

  /* WorkingIndicator, HoppingDots, shimmer (Loading.swift) */
  .spin { animation: spin .8s linear infinite; flex: none; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .dots { display: inline-flex; gap: 4.5px; height: 14px; align-items: flex-end; padding: 0 2px 1px; flex: none; }
  .dots i { width: 6px; height: 6px; border-radius: 3px; background: var(--dot, #fff); opacity: .4; animation: hop 1.2s infinite; }
  .dots i:nth-child(2) { animation-delay: .15s; } .dots i:nth-child(3) { animation-delay: .3s; }
  @keyframes hop { 0% { transform: translateY(0); opacity: .4; } 21% { transform: translateY(-3.5px); opacity: .9; } 42%, 100% { transform: translateY(0); opacity: .4; } }
  .shimmer { background: linear-gradient(100deg, var(--sh, rgba(255,255,255,.94)) 0 35%, #fff 50%, var(--sh, rgba(255,255,255,.94)) 65% 100%);
    background-size: 300% 100%; -webkit-background-clip: text; background-clip: text; color: transparent !important; animation: shim 1.8s linear infinite; }
  @keyframes shim { from { background-position: 100% 0; } to { background-position: 0 0; } }

  /* ===== Surfaces (Surfaces.swift FlatCard, Glass.swift GlassSurface) ===== */
  .flat { position: relative; border-radius: 14px; background: var(--fill-card); box-shadow: 0 6px 24px rgba(0,0,0,.5); }
  .flat::after { content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1px; pointer-events: none;
    background: linear-gradient(rgba(255,255,255,.12), rgba(255,255,255,.05));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; }
  .flat > .clip { border-radius: inherit; overflow: hidden; }
  .glass { position: relative; border-radius: 20px; isolation: isolate; }
  .glass > .frost { position: absolute; inset: 0; border-radius: inherit; z-index: -1;
    background: linear-gradient(rgba(255,255,255,.11), rgba(255,255,255,.035)), rgba(255,255,255,.08);
    backdrop-filter: blur(22px) saturate(150%); -webkit-backdrop-filter: blur(22px) saturate(150%); }
  .glass > .frost::before { content: ""; position: absolute; inset: 0; border-radius: inherit; z-index: -1;
    background: rgba(3,8,54,.3); filter: blur(15px); transform: translateY(9px); }
  .glass > .frost::after { content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1px;
    background: linear-gradient(rgba(255,255,255,.4), rgba(255,255,255,.1));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; }
  .glass.pressable:active { transform: scale(.975); transition: transform .26s cubic-bezier(.3,1.4,.5,1); }

  /* BackdropGradient(.mesh): still light pooling in the lower half, dark at the top (approximation). */
  .backdrop { background:
      radial-gradient(70% 55% at 55% 100%, rgba(67,111,255,.95), rgba(67,111,255,0) 70%),
      radial-gradient(55% 45% at 0% 100%, rgba(0,94,255,.9), rgba(0,94,255,0) 75%),
      radial-gradient(50% 45% at 100% 100%, rgba(74,86,255,.9), rgba(74,86,255,0) 75%),
      radial-gradient(60% 40% at 60% 52%, rgba(74,86,255,.65), rgba(74,86,255,0) 75%),
      linear-gradient(to bottom, #010101 0%, #050318 22%, #1500FF 58%, #0A1BA8 72%, #005EFF 100%); }
  /* ScreenBackdrop (ListScreens.swift): the mesh flipped (light at the top), 340pt, fading out, at 60%. */
  .screen-backdrop { position: absolute; left: 0; right: 0; top: 0; height: 340px; opacity: .6; pointer-events: none; transform: scaleY(-1);
    -webkit-mask-image: linear-gradient(to top, #000 0%, rgba(0,0,0,.55) 45%, transparent 100%); mask-image: linear-gradient(to top, #000 0%, rgba(0,0,0,.55) 45%, transparent 100%); }
  /* HeroLight (ProductReportView): navy top, the blue family pooling below. */
  .herolight { background:
      radial-gradient(55% 45% at 50% 100%, rgba(67,111,255,1), rgba(67,111,255,0) 100%),
      radial-gradient(50% 50% at 0% 100%, rgba(0,94,255,1), rgba(0,94,255,0) 100%),
      radial-gradient(50% 50% at 100% 100%, rgba(74,86,255,1), rgba(74,86,255,0) 100%),
      radial-gradient(45% 30% at 55% 45%, rgba(21,0,255,.9), rgba(21,0,255,0) 100%),
      linear-gradient(to bottom, #070B30 0%, #080D36 15%, #10149E 50%, #0A1BA8 75%, #1F3FD6 100%); }

  /* Chip (Surfaces.swift) */
  .chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; height: 44px; display: flex; align-items: center; }
  .chip > span { height: 32px; padding: 0 14px; border-radius: 16px; display: flex; align-items: center; gap: 6px;
    background: var(--fill-chip); color: var(--t2); font-size: 13px; letter-spacing: .1px; white-space: nowrap; transition: all .15s ease-out; }
  .chip:active > span { background: var(--fill-chip-p); color: var(--t1); }
  .chip.on > span { background: rgba(255,255,255,.22); color: var(--t1); box-shadow: inset 0 0 0 1px var(--stroke-hover); }

  /* RoundIcon (ListScreens.swift): 36pt face (38 in Discover), 44pt hit area */
  .round { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; flex: none; }
  .round > span { width: var(--s, 36px); height: var(--s, 36px); border-radius: 50%; display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,.07); box-shadow: inset 0 0 0 1px rgba(255,255,255,.12); color: rgba(255,255,255,.6); transition: transform .2s cubic-bezier(.3,1.5,.5,1); }
  .round:active > span { transform: scale(.9); }
  .list-row { width: 100%; text-align: left; transition: background .15s ease-out; }
  .list-row:active { background: var(--fill-row); }

  /* Tab bar: iOS 26 floating glass, dressed by RootTabView (white at 36% / 94%, Hiragino W5 10, no blue) */
  .tabbar { position: absolute; left: 20px; right: 20px; bottom: 24px; display: flex; gap: 12px; align-items: center; z-index: 20; }
  .tabs, .search-tab { background: rgba(1,1,1,.55); backdrop-filter: blur(20px) saturate(140%); -webkit-backdrop-filter: blur(20px) saturate(140%);
    box-shadow: inset 0 .5px 0 rgba(255,255,255,.14), inset 0 0 0 .5px rgba(255,255,255,.08), 0 8px 24px rgba(0,0,0,.45); }
  .tabs { flex: 1; display: flex; justify-content: space-around; height: 62px; border-radius: 31px; padding: 4px; }
  .tab { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; border-radius: 27px;
    font-weight: 500; font-size: 10px; color: rgba(255,255,255,.36); }
  .tab.on { color: rgba(255,255,255,.94); background: rgba(255,255,255,.08); }
  .search-tab { width: 62px; height: 62px; border-radius: 31px; display: flex; align-items: center; justify-content: center; color: rgba(255,255,255,.36); }
  .search-tab.on { color: rgba(255,255,255,.94); }
  .home-indicator { position: absolute; bottom: 8px; left: 50%; width: 140px; height: 5px; margin-left: -70px; background: #fff; border-radius: 3px; z-index: 70; opacity: .9; }

  /* Sheets (system shape; NotYetApp: canvas background, drag indicator visible) */
  .sheet { position: absolute; left: 0; right: 0; bottom: 0; top: 62px; background: var(--canvas); z-index: 25;
    border-top-left-radius: 38px; border-top-right-radius: 38px; box-shadow: 0 -.5px 0 rgba(255,255,255,.14);
    display: flex; flex-direction: column; transform: translateY(100%); transition: transform .4s cubic-bezier(.2,.85,.25,1); overflow: hidden; }
  .sheet.open { transform: translateY(0); }
  .sheet > .bg { position: absolute; inset: 0; pointer-events: none; }
  .sheet .grabber { position: relative; width: 36px; height: 5px; border-radius: 3px; background: rgba(255,255,255,.28); margin: 6px auto 0; flex: none; }
  .sheet .sheet-nav { position: relative; display: flex; justify-content: flex-end; align-items: center; padding: 2px 16px 4px; height: 52px; flex: none; }
  .sheet .scroll { padding-bottom: 48px; }
  .scrim { position: absolute; inset: 0; background: rgba(0,0,0,.55); z-index: 24; opacity: 0; pointer-events: none; transition: opacity .3s; }
  .scrim.on { opacity: 1; pointer-events: auto; }

  /* Motion: RiseEffect (Metrics.swift), Motion.cardArrive with stagger, symbol bounce */
  .rise { animation: rise .8s cubic-bezier(.25,1.15,.4,1) both; transform-origin: 50% 100%; }
  @keyframes rise { from { opacity: 0; transform: translateY(46px) scale(.92); } to { opacity: 1; transform: none; } }
  .pop { animation: pop .5s cubic-bezier(.3,1.6,.5,1) both; }
  @keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    .rise, .pop, .shimmer, .island, .dots i, .spin { animation: none !important; transition: none !important; }
    .shimmer { background: none; color: inherit !important; }
  }

  /* ===== ProductReportView ===== */
  .hero { position: relative; border-radius: 28px; overflow: hidden; box-shadow: 0 10px 56px rgba(5,11,94,.35); padding: 16px; }
  .hero > .herolight { position: absolute; inset: 0; }
  .hero::after { content: ""; position: absolute; inset: 0; border-radius: inherit; padding: .75px; pointer-events: none;
    background: linear-gradient(rgba(107,136,255,.6), rgba(255,255,255,.06));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; }
  .wordmark46 { font-weight: 600; font-size: 46px; letter-spacing: -1.38px; white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.22); min-width: 0; }
  .statement20 { font-weight: 400; font-size: 20px; letter-spacing: -0.24px; line-height: 26px; }
  .sample { display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 10px; border-radius: 12px; flex: none;
    background: rgba(0,0,0,.28); box-shadow: inset 0 0 0 .75px rgba(255,255,255,.24); color: var(--t1); font-size: 12px; letter-spacing: .1px; white-space: nowrap; }
  .meter { height: 4px; border-radius: 2px; background: rgba(255,255,255,.14); position: relative; }
  .meter i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 2px; min-width: 4px; }
  .section-title { margin-bottom: 10px; }
  .price-row { display: flex; align-items: baseline; gap: 12px; padding: 14px 16px; }
  .chart-card { border-radius: 14px; background: var(--fill-card); box-shadow: inset 0 0 0 1px var(--divider); padding: 16px 12px 10px; }

  /* ===== Live Activity (Widget/ScanLiveActivity.swift): system fonts, near-black ===== */
  .island { position: absolute; top: 11px; left: 50%; transform: translateX(-50%); width: 126px; height: 37px; background: #000;
    border-radius: 19px; z-index: 65; color: #fff; overflow: hidden; cursor: pointer;
    transition: width .5s cubic-bezier(.3,1.25,.45,1), height .5s cubic-bezier(.3,1.25,.45,1), border-radius .5s; }
  .island.compact { width: 236px; }
  .island.expanded { width: 380px; height: 124px; border-radius: 46px; }
  .island.expanded.working { height: 146px; }
  .island .compact-row { position: absolute; inset: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 14px 0 12px; }
  .island .expanded-body { position: absolute; inset: 0; padding: 18px 20px 18px; display: none; flex-direction: column; gap: 12px; }
  .island.expanded .compact-row { display: none; }
  .island.expanded .expanded-body { display: flex; }
  .la-pill { height: 24px; padding: 0 10px; border-radius: 12px; display: inline-flex; align-items: center; font: 500 12px/1 -apple-system, system-ui;
    background: rgba(255,255,255,.10); box-shadow: inset 0 0 0 .75px rgba(255,255,255,.16); color: rgba(255,255,255,.94); white-space: nowrap; flex: none; }
  .la-x { width: 32px; height: 32px; border-radius: 16px; display: flex; align-items: center; justify-content: center; flex: none;
    background: rgba(255,255,255,.10); box-shadow: inset 0 0 0 1px rgba(255,255,255,.16); color: rgba(255,255,255,.62); }
  .la-progress { height: 4px; border-radius: 2px; background: rgba(255,255,255,.16); position: relative; overflow: hidden; flex: none; }
  .la-progress i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 2px; background: #436FFF; width: 0; }
  .la-progress i.run { transition: width 25s linear; width: 100%; }
  .lock { position: absolute; inset: 0; z-index: 55; display: none; flex-direction: column; align-items: center; }

/* ---------- PriceChartView: key figures, sale windows, step line, typical rule, low, today, projection ---------- */
function chartView(r, projected, projectedDate, accent) {
  const today = TODAY, start = new Date(Date.UTC(2025, 10, 15, 9, 41));
  const sorted = r.history.map(p => ({ d: day(p.date), v: p.price })).filter(p => p.d <= today).sort((a, b) => a.d - b.d);
  const pts = sorted.filter(p => p.d >= start);
  const before = sorted.filter(p => p.d < start).pop(); if (before) pts.unshift({ d: start, v: before.v });
  pts.push({ d: today, v: r.currentPrice });
  const typical = r.typicalPrice ?? null;
  const minV = Math.min(...pts.map(p => p.v));
  let low = { v: minV, d: pts.filter(p => p.v === minV).pop().d };
  if (r.lowest?.price != null && r.lowest?.date) low = { v: r.lowest.price, d: day(r.lowest.date) };
  let proj = null;
  if (projected != null) proj = { d: projectedDate && projectedDate > today ? projectedDate : addDays(today, 30), v: projected };
  const lastDate = proj ? proj.d : today;
  const end = new Date(lastDate.getTime() + Math.max((lastDate - start) * .03, 864e5));
  const vals = pts.map(p => p.v).concat([typical, low.v, proj?.v].filter(v => v != null));
  const lo = Math.min(...vals), hi = Math.max(...vals), span = Math.max(hi - lo, hi * .04, 1);
  const y0 = Math.max(0, lo - span * .2), y1 = hi + span * .2;
  const showLow = low.v < pts[pts.length - 1].v && low.d >= start && low.d <= today;

  // Plot area: trailing y labels take ~40pt; x labels below.
  const W = 346, H = 200, PR = 40, PT = 6, PB = 22;
  const X = d => (d - start) / (end - start) * (W - PR);
  const Y = v => PT + (1 - (v - y0) / (y1 - y0)) * (H - PT - PB);
  let g = '';
  for (const s of r.saleEvents || []) {
    const a = Math.max(day(s.startsAt), start), b = Math.min(Math.max(day(s.endsAt || s.startsAt), day(s.startsAt).getTime() + 864e5), today);
    if (a < b) g += `<rect x="${X(a)}" y="${PT}" width="${Math.max(1, X(b) - X(a))}" height="${H - PT - PB}" fill="rgba(255,255,255,.05)"/>`;
  }
  const raw = (y1 - y0) / 3, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => s >= raw * .8);
  for (let v = Math.ceil(y0 / step) * step; v <= y1; v += step) {
    g += `<line x1="0" x2="${W - PR}" y1="${Y(v)}" y2="${Y(v)}" stroke="rgba(255,255,255,.16)" stroke-width=".5"/>`;
    g += `<text x="${W - PR + 6}" y="${Y(v) + 4}" font-size="12" fill="rgba(255,255,255,.36)">${money(v)}</text>`;
  }
  for (let m = new Date(Date.UTC(2025, 11, 1)); m <= end; m.setUTCMonth(m.getUTCMonth() + 3))
    g += `<text x="${X(m)}" y="${H - 4}" font-size="12" fill="rgba(255,255,255,.36)">${m.toLocaleDateString('en-US', { month: 'short', timeZone: 'UTC' })}</text>`;
  let path = `M${X(pts[0].d).toFixed(1)},${Y(pts[0].v).toFixed(1)}`;
  for (let i = 1; i < pts.length; i++) path += ` H${X(pts[i].d).toFixed(1)} V${Y(pts[i].v).toFixed(1)}`;
  const gid = 'ar' + (++maskId);
  g += `<defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".10"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>`;
  g += `<path d="${path} V${H - PB} H${X(pts[0].d).toFixed(1)} Z" fill="url(#${gid})"/>`;
  if (typical != null) g += `<line x1="0" x2="${W - PR}" y1="${Y(typical)}" y2="${Y(typical)}" stroke="rgba(255,255,255,.36)" stroke-dasharray="4 4"/>`;
  g += `<path d="${path}" fill="none" stroke="rgba(255,255,255,.94)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  if (proj) {
    g += `<line x1="${X(today)}" y1="${Y(r.currentPrice)}" x2="${X(proj.d)}" y2="${Y(proj.v)}" stroke="${accent}" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round"/>`;
    g += `<circle cx="${X(proj.d)}" cy="${Y(proj.v)}" r="3.4" fill="${accent}"/>`;
  }
  if (showLow) g += `<circle cx="${X(low.d)}" cy="${Y(low.v)}" r="6.2" fill="#010101"/><circle cx="${X(low.d)}" cy="${Y(low.v)}" r="4" fill="#436FFF"/>`;
  g += `<circle cx="${X(today)}" cy="${Y(r.currentPrice)}" r="9.4" fill="${accent}" fill-opacity=".22"/><circle cx="${X(today)}" cy="${Y(r.currentPrice)}" r="4.4" fill="${accent}"/>`;

  const fig = (label, value, glyph) => `<div class="stack grow" style="gap:4px"><div class="row" style="gap:6px">${glyph}<span class="t-foot c3 ell">${label}</span></div><span class="w6 num" style="font-size:17px">${money(value)}</span></div>`;
  const dot = c => `<span style="width:7px;height:7px;border-radius:4px;background:${c};flex:none"></span>`;
  const dash = '<svg width="12" height="2" style="flex:none"><line x1="0" x2="12" y1="1" y2="1" stroke="rgba(255,255,255,.36)" stroke-width="1.5" stroke-dasharray="3 2"/></svg>';
  return `<div class="stack" style="gap:14px">
    <div class="row" style="gap:12px;align-items:flex-start">${fig('Today', r.currentPrice, dot(accent))}${typical != null ? fig('Typical', typical, dash) : ''}${fig('12-mo low', low.v, dot('#436FFF'))}</div>
    <svg width="100%" viewBox="0 0 ${W} ${H}" style="display:block;overflow:visible;font-family:inherit" role="img" aria-label="Price over the last 12 months">${g}</svg>
    ${r.isSampleData ? '<span class="t-foot c3">Sample data</span>' : ''}
  </div>`;
}

// VerdictHero: product line, then the verdict on glass over the hero light.

          ${confidence != null ? `<div class="row" style="gap:10px;margin-top:2px"><span class="t-foot c2">Confidence</span><span class="meter grow"><i style="width:${Math.round(confidence * 100)}%;background:${st.color}"></i></span><span class="t-caption c1 num">${Math.round(confidence * 100)}%</span></div>` : ''}
          ${matchNote ? `<div class="row c2" style="gap:6px;align-items:flex-start">${icon('question', 12, 2, 'style="margin-top:-1px;flex:none"')}<span class="t-foot ls-3">${matchNote}</span></div>` : ''}
        </div>
      </div>
    </div></div>`;
}
const reportSection = (title, body) => `<div><div class="t-section c3 section-title">${title}</div>${body}</div>`;
const priceRow = (label, detail, value, color = 'var(--t1)') => `<div class="price-row"><div class="stack grow" style="gap:4px"><span class="t-item c2">${label}</span>${detail ? `<span class="t-foot c3 ls-3">${detail}</span>` : ''}</div><span class="t-card num" style="color:${color};white-space:nowrap">${value}</span></div>`;
function usualDetail(r) {
  const parts = [];
  if (r.typicalPrice > 0) {
    const diff = r.currentPrice - r.typicalPrice, pct = Math.round(Math.abs(diff) / r.typicalPrice * 100);
    parts.push(Math.abs(diff) / r.typicalPrice < .01 ? 'The usual price' : diff < 0 ? `${money(-diff)} under usual (${pct}%)` : `${money(diff)} above usual (${pct}%)`);
  }
  if (r.lowest?.price != null && r.currentPrice <= r.lowest.price + .5) parts.push('lowest in a year');
  return parts.join(' · ');
}
function forecastDetail(f) {
  const p = [];
  if (f.byDate) p.push('by ' + md(day(f.byDate)));
  if (f.eventName) p.push(f.eventName);
  p.push({ better_price_likely: 'likely lower', better_price_possible: 'may drop', no_better_price_expected: 'unlikely to drop' }[f.outlook]);
  if (f.savingsAtLow >= 1) p.push(`save up to ${money(f.savingsAtLow)}${f.savingsAtLowPercent != null ? ` (${Math.round(f.savingsAtLowPercent)}%)` : ''}`);
  if (f.confidence != null) p.push(Math.round(f.confidence * 100) + '% confidence');
  return p.filter(Boolean).join(' · ');
}
function discountDetail(d) {
  const p = [];
  if (d.claimedDiscountPercent != null) p.push(`Claims ${Math.round(d.claimedDiscountPercent)}%${d.claimedWasPrice != null ? ' off ' + money(d.claimedWasPrice) : ''}`);
  if (d.realDiscountPercent != null) { const x = Math.round(d.realDiscountPercent); p.push(x > 0 ? `really ${x}% under usual` : x < 0 ? `really ${-x}% above usual` : 'really the usual price'); }
  if (d.wasPriceChargedSharePercent != null && d.status !== 'genuine') p.push(`was-price charged ${Math.round(d.wasPriceChargedSharePercent)}% of days`);
  return p.length ? p.join(' · ') : d.explanation;
}
const compact = n => n >= 1000 ? (Math.round(n / 100) / 10).toString().replace(/\.0$/, '') + 'K' : String(n);
function stars(rating) {
  let s = '';
  for (let i = 0; i < 5; i++) {
    const f = rating - i, id = 'h' + (++maskId);
    const fill = f >= .75 ? '#FFB547' : f >= .25 ? `url(#${id})` : 'none';
    s += `<svg width="12" height="12" viewBox="0 0 24 24" style="flex:none"><defs><linearGradient id="${id}"><stop offset="50%" stop-color="#FFB547"/><stop offset="50%" stop-color="transparent"/></linearGradient></defs><path d="${I.star.match(/d="([^"]+)"/)[1]}" fill="${fill}" stroke="#FFB547" stroke-width="1.8" stroke-linejoin="round"/></svg>`;
  }
  return `<span class="row" style="gap:2px" aria-label="${rating.toFixed(1)} out of 5 stars">${s}</span>`;
}
function reportBody(key, { fromDiscover = false } = {}) {
  const r = REPORTS[key], st = verdict(r.verdict), v = r.verdict;
  const projected = r.projectedPrice ?? (r.forecast?.low != null && r.forecast?.high != null ? (r.forecast.low + r.forecast.high) / 2 : null);
  const forecastDate = day(r.waitUntil ?? r.forecast?.byDate);
  const f = r.forecast;
  const range = f && f.low != null ? (f.high != null && Math.abs(f.high - f.low) >= 1 ? `${money(Math.min(f.low, f.high))}–${money(Math.max(f.low, f.high))}` : money(f.low)) : null;
  const disc = { genuine: ['Real', '#3DDC97'], misleading: ['Misleading', '#FF5C7A'], unclear: ['Unclear', '#FFB547'] }[r.discount?.status];

  // Price: now (with usual and low), expected range, discount check.
  const price = reportSection('Price', `<div class="flat"><div class="clip">
    <div class="row" style="padding:14px 16px;gap:12px;align-items:baseline"><div class="stack grow" style="gap:4px"><span class="t-item c2">${r.whereToBuy ? 'Now at ' + r.whereToBuy.retailer : 'Now'}</span>${usualDetail(r) ? `<span class="t-foot c3">${usualDetail(r)}</span>` : ''}</div>
      <span class="num c1" style="font-weight:600;font-size:34px;letter-spacing:-1.02px">${money(r.currentPrice)}</span></div>
    ${range ? `<div class="hairline"></div>${priceRow('Expected', forecastDetail(f), range)}` : projected != null ? `<div class="hairline"></div>${priceRow('Expected', forecastDate ? 'by ' + md(forecastDate) : '', money(projected))}` : ''}
    ${disc ? `<div class="hairline"></div>${priceRow('Discount', discountDetail(r.discount), disc[0], disc[1])}` : ''}
  </div></div>`);
  const chart = reportSection('Last 12 months', `<div class="chart-card">${chartView(r, projected, forecastDate, st.color)}</div>`);

  </div>`);
  const opts = (r.alternatives || []).filter(a => a.title);
  const alts = opts.length ? reportSection(v === 'CONSIDER_ALTERNATIVE' ? 'Better options' : 'Alternatives', `<div class="flat"><div class="clip">${opts.slice(0, 3).map((a, i) => `${i ? '<div class="hairline"></div>' : ''}
    <button class="list-row row" style="gap:12px;align-items:flex-start;padding:14px 16px">
      <span class="stack grow" style="gap:4px"><span class="t-item c1 ls-3">${a.title}</span><span class="t-foot c3">${[a.retailer, a.similarityPercent != null ? Math.round(a.similarityPercent) + '% similar' : null].filter(Boolean).join(' · ')}</span>${a.reasoning ? `<span class="t-caption c2 ls-3">${a.reasoning}</span>` : ''}</span>
      <span class="stack" style="gap:4px;align-items:flex-end;flex:none"><span class="t-card num">${money(a.price)}</span>${a.savingsVsCurrent >= 1 ? `<span class="t-foot num" style="color:#3DDC97">Save ${money(a.savingsVsCurrent)}</span>` : ''}</span>
      ${a.url ? `<span class="c3" style="margin-top:2px">${icon('chev', 12, 2.4)}</span>` : ''}
    </button>`).join('')}</div></div>`) : '';

  // Actions. Buy now: the store is the blue key; every other verdict: tracking is.
  const storeIsPrimary = v === 'BUY_NOW' && r.whereToBuy;
  const needBy = addDays(TODAY, S.needByDays), needByStr = iso(needBy), tracked = S.tracked[key];
  const isCurrent = tracked === needByStr;
  const trackLabel = !tracked ? `Track until ${md(needBy)}` : isCurrent ? `Tracking until ${md(day(tracked))}` : `Change to ${md(needBy)}`;
  const reminderDay = r.waitUntil && r.waitUntil <= (tracked || needByStr) ? r.waitUntil : (tracked || needByStr);
  const chips = [['1 week', 7], ['2 weeks', 14], ['1 month', 30], ['3 months', 90]].map(([l, d]) => chip(l, S.needByDays === d, `data-needby="${d}"`)).join('');
  const track = fromDiscover ? keyBtn('Check this for me', `data-check="${key}"`)
    : reportSection('Need it by', `<div class="stack" style="gap:12px"><div class="chips" style="margin:-6px 0">${chips}</div>
      ${storeIsPrimary ? quietBtn(trackLabel, `data-track="${key}" ${isCurrent ? 'disabled' : ''}`) : keyBtn(trackLabel, `data-track="${key}" ${isCurrent ? 'disabled' : ''}`)}
      ${tracked ? `<div class="row c2" style="gap:8px;align-items:flex-start">${icon('bell', 13, 2, 'style="flex:none;margin-top:-1px"')}<span class="t-caption ls-3">Reminder ${md(day(reminderDay))}, 9 AM. Prices checked daily.</span></div>` : ''}</div>`);
  const w = r.whereToBuy;

      ${r.avgRating != null ? `<div class="hairline"></div><div class="row" style="gap:8px;padding:14px 16px"><span class="t-item c2 grow">Reviews</span>${stars(r.avgRating)}<span class="t-item c1 num">${r.avgRating.toFixed(1)}</span>${r.reviewCount ? `<span class="t-foot c3">(${compact(r.reviewCount)})</span>` : ''}</div>` : ''}
    </div></div>${storeIsPrimary ? keyBtn('Open on ' + w.retailer) : quietBtn('Open on ' + w.retailer)}</div>`) : '';
  const years = r.yearsOfData ?? 0, months = Math.max(1, Math.round(years * 12));

  const evidence = (v === 'CONSIDER_ALTERNATIVE' ? [alts, price] : [price]).concat([chart, why], v !== 'CONSIDER_ALTERNATIVE' ? [alts] : []).filter(Boolean);
  const actions = (v === 'BUY_NOW' ? [store, track] : [track, store]).filter(Boolean);
  const part = (html, i) => `<div class="stack rise" style="gap:28px;animation-delay:${i * .08}s">${html}</div>`;
  return `<div class="stack" style="gap:28px;padding:8px 16px 40px">
    ${verdictHero({ v, productName: r.name, oneLiner: r.oneLiner, confidence: r.confidence, isSample: r.isSampleData, matchNote: r.matchNote })}
    ${part(evidence.join(''), 1)}${part(actions.join(''), 2)}${part(footer, 3)}
  </div>`;
}

    el.style.fontSize = ''; const room = el.parentElement.clientWidth - 48 - 12;
    if (el.scrollWidth > room) { const k = Math.max(.6, room / el.scrollWidth); el.style.fontSize = 46 * k + 'px'; el.style.letterSpacing = -1.38 * k + 'px'; }
  });

// Mock flow: a new key digs for a few seconds (steps advance, the first look arrives), then the report.
function openReport(key, dig = false) {
  closeStore(); clearTimeout(digTimer); S.sheetKey = key;
  if (!dig) return openSheet(reportBody(key));
  const step = (i, quick) => { const d = digging(i, quick); openSheet(d.html, { bg: d.bg }); S.sheetKey = null; };
  let i = 0; step(0);
  const next = () => { i++; if (!$('sheet').classList.contains('open')) return;
    if (i < 4) { step(i, i >= 2 ? QUICK : null); digTimer = setTimeout(next, 1300); } else { openSheet(reportBody(key)); S.sheetKey = key; } };

/* ---------- Named states (controls and ?state=) ---------- */
function reset() { clearTimeout(laTimer); clearTimeout(askTimer); closeSheet(); closeStore(); lockScreen(null); island('off'); Object.assign(S, { searchPage: null, homeEmpty: false, ask: null, asked: null, query: '' }); }
function show(name) {
  reset();
  const m = name.match(/^report-([a-e])(-tracked)?$/);
  if (m) { S.tab = 'history'; render(); if (m[2]) S.tracked[m[1]] = iso(addDays(TODAY, S.needByDays)); else delete S.tracked[m[1]]; return openReport(m[1]); }
  if (name === 'digging') { S.tab = 'home'; render(); const d = digging(1, null); return openSheet(d.html, { bg: d.bg }); }
  if (name === 'digging-quick') { S.tab = 'home'; render(); const d = digging(2, QUICK); return openSheet(d.html, { bg: d.bg }); }
  if (name === 'error' || name === 'error-offline') { S.tab = 'home'; render(); return openSheet(problemView(name === 'error' ? 'failed' : 'unreachable')); }
  if (name === 'home-empty') { S.homeEmpty = true; S.tab = 'home'; return render(); }
  if (name === 'discover') { S.tab = 'search'; S.searchPage = 'list'; S.listTitle = 'Lowest prices'; return render(); }
  if (name === 'search-asking') { S.tab = 'search'; S.ask = 'asking'; S.asked = 'Is the Dyson V15 a good deal?'; S.askStage = 1; return render(); }
  if (name === 'search-failed') { S.tab = 'search'; S.ask = 'failed'; S.asked = 'that cordless vacuum'; return render(); }
  if (name === 'settings') { render(); return openSheet(settingsBody(), { title: 'Settings', doneColor: '#436FFF' }); }
  if (name.startsWith('island-')) { S.tab = 'home'; render(); storePage(); S.progressPct = 30; return island(name.slice(7)); }
  if (name.startsWith('lock-')) return lockScreen(name.slice(5));
  if (['home', 'history', 'search', 'account'].includes(name)) { S.tab = name; return render(); }
}

/* ---------- Events ---------- */
let askTimer = null;
// SearchView.ask in mock mode: the steps advance on a clock, then the report sheet opens.
function ask() {
  const q = (S.query || S.asked || '').trim(); if (!q) return;
  Object.assign(S, { ask: 'asking', asked: q, query: '', askStage: 0 }); render();
  const tick = () => { if (S.ask !== 'asking') return; if (S.askStage < 2) { S.askStage++; render(); askTimer = setTimeout(tick, 900); }
    else { Object.assign(S, { ask: null, asked: null }); render(); openReport('b', true); } };
  clearTimeout(askTimer); askTimer = setTimeout(tick, 900);
}
document.addEventListener('click', e => {
  const t = e.target.closest('button, #island, #scrim'); if (!t) return;
  if (t.id === 'btnTap') return backTap();
  if (t.dataset.state) return show(t.dataset.state);
  if (t.id === 'scrim' || t.hasAttribute('data-close')) return closeSheet();
  if (t.dataset.cancel !== undefined) { e.stopPropagation(); clearTimeout(laTimer); island('off'); return; }
  if (t.id === 'island') {
    if (laState === 'working') { S.progressPct = Math.min(100, (Date.now() - (S.tapStart || Date.now())) / 250); island('working-expanded'); return; }
    if (laState === 'working-expanded') { island('working'); return; }
    if (laState.startsWith('ready')) { clearTimeout(laTimer); island('off'); closeStore(); S.tab = 'home'; render(); openReport('a'); }
    return;
  }
  if (t.dataset.open) return openReport(t.dataset.open);
  if (t.dataset.tab) { reset(); S.tab = t.dataset.tab; return render(); }
  if (t.dataset.filter) { S.filter = t.dataset.filter; return render(); }
  if (t.hasAttribute('data-sort')) { S.newestFirst = !S.newestFirst; return render(); }
  if (t.dataset.needby) { S.needByDays = +t.dataset.needby; return rerenderReports(); }
  if (t.dataset.track) { S.tracked[t.dataset.track] = iso(addDays(TODAY, S.needByDays)); return rerenderReports(); }
  if (t.dataset.check) return openReport(t.dataset.check, true);
  if (t.dataset.list) { S.searchPage = 'list'; S.listTitle = t.dataset.title; return render(); }
  if (t.dataset.discover) { S.searchPage = 'report'; S.discoverKey = t.dataset.discover; return render(); }
  if (t.hasAttribute('data-back')) { S.searchPage = null; return render(); }
  if (t.hasAttribute('data-back-list')) { S.searchPage = 'list'; return render(); }
  if (t.hasAttribute('data-mic')) { S.query = 'Is the Dyson V15 a good deal?'; return render(); }
  if (t.hasAttribute('data-send')) return ask();
  if (t.hasAttribute('data-stop')) { clearTimeout(askTimer); Object.assign(S, { query: S.asked, ask: null, asked: null }); return render(); }
  if (t.hasAttribute('data-clear-ask')) { Object.assign(S, { ask: null, asked: null }); return render(); }
});
document.addEventListener('input', e => {

  if ((e.key === 'Enter' || e.key === ' ') && e.target.id === 'island') { e.preventDefault(); e.target.click(); }
  if (e.key === 'Escape') closeSheet();
});
function rerenderReports() {
  if ($('sheet').classList.contains('open') && S.sheetKey) { const top = $('sheetBody').scrollTop; $('sheetBody').innerHTML = reportBody(S.sheetKey); $('sheetBody').scrollTop = top; }
  if (S.tab === 'home' && !S.homeEmpty) { const sc = $('screen').querySelector('.scroll'); const top = sc ? sc.scrollTop : 0; render(); const n = $('screen').querySelector('.scroll'); if (n) n.scrollTop = top; }
}

/* ---------- Fit the phone to the window ---------- */
const params = new URLSearchParams(location.search);
if (params.has('bare')) document.body.classList.add('bare');
function fit() {
  const s = document.body.classList.contains('bare') ? 1 : Math.min(1, (window.innerHeight - 40) / 894, (window.innerWidth - 40) / 422);
  $('phoneScale').style.transform = `scale(${s})`;
  $('phoneWrap').style.width = 402 * s + 'px'; $('phoneWrap').style.height = 874 * s + 'px';
}
window.addEventListener('resize', fit);
$('statusIcons').innerHTML = `<svg width="18" height="12" viewBox="0 0 18 12" fill="#fff" aria-hidden="true"><rect x="0" y="8" width="3" height="4" rx=".7"/><rect x="5" y="5" width="3" height="7" rx=".7"/><rect x="10" y="2" width="3" height="10" rx=".7"/><rect x="15" y="0" width="3" height="12" rx=".7"/></svg>
  <svg width="27" height="13" viewBox="0 0 27 13" aria-hidden="true"><rect x="0.5" y="0.5" width="23" height="12" rx="3.5" fill="none" stroke="rgba(255,255,255,.5)"/><rect x="2" y="2" width="18" height="9" rx="2" fill="#fff"/><rect x="24.5" y="4" width="2" height="5" rx="1" fill="rgba(255,255,255,.5)"/></svg>`;
render(); fit();
if (params.get('state')) show(params.get('state'));
</script>
