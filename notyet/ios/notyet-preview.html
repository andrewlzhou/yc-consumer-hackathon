<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Not Yet preview</title>
<!--
  Browser preview of the Not Yet iPhone app in the Worldscape design language. Each block is labeled with
  the Swift view it mirrors. Values come from Views/DesignSystem/*.swift and design/worldscape-language.md:
  change them there first, then here. Sample data matches App/SampleData.swift where the two overlap.
  Open with ?bare to show the phone alone at 402x874 (used for screenshots); ?state=<name> opens a state.
-->
<style>
  /* Hiragino Sans by PostScript name (macOS has W0-W9; the iPhone may only have W3/W6/W7). */
  @font-face { font-family: "HS"; font-weight: 400; src: local("HiraginoSans-W4"), local("Hiragino Sans W4"); }
  @font-face { font-family: "HS"; font-weight: 500; src: local("HiraginoSans-W5"), local("Hiragino Sans W5"); }
  @font-face { font-family: "HS"; font-weight: 600; src: local("HiraginoSans-W6"), local("Hiragino Sans W6"); }

  :root {
    color-scheme: dark;
    --page-bg: #0c0d10;
    --page-ink: #eef1f5;
    --page-muted: #8b93a1;
    --page-line: #262a31;
  }
  :root[data-theme="light"] { color-scheme: light; --page-bg: #e9ebef; --page-ink: #14181f; --page-muted: #5b6474; --page-line: #cfd4dc; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --page-bg: #0c0d10; } }
  :root[data-theme="dark"] { --page-bg: #0c0d10; }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--page-bg); color: var(--page-ink);
    font-family: "HS", "Hiragino Sans", -apple-system, BlinkMacSystemFont, system-ui, sans-serif; }
  .stage { min-height: 100%; display: flex; align-items: center; justify-content: center; gap: 32px; padding: 20px; flex-wrap: wrap; }
  .controls { width: 230px; display: flex; flex-direction: column; gap: 6px; max-height: calc(100vh - 40px); overflow-y: auto; }
  .controls h1 { font: 600 22px/1.1 "HS", "Hiragino Sans", system-ui; letter-spacing: -0.6px; margin: 0 0 4px; }
  .controls p { margin: 10px 0 0; font-size: 12px; letter-spacing: .3px; color: var(--page-muted); }
  .controls button { font: 400 13px/1 "HS", "Hiragino Sans", system-ui; text-align: left; padding: 9px 11px; border: 1px solid var(--page-line);
    border-radius: 8px; background: transparent; color: var(--page-ink); cursor: pointer; }
  .controls button:hover { border-color: var(--page-muted); }
  .controls button:focus-visible, .phone button:focus-visible, .phone input:focus-visible { outline: 2px solid #436FFF; outline-offset: 2px; }
  .phone-wrap { position: relative; }
  .phone-scale { transform-origin: top left; }
  body.bare .controls { display: none; }
  body.bare .stage { padding: 0; display: block; min-height: 0; }
  body.bare .phone { border-radius: 0; box-shadow: none; }

  /* ===== Phone: dark only (Palette.swift) ===== */
  .phone {
    --canvas: #010101; --electric: #005EFF; --iris: #4A56FF; --ultramarine: #1500FF; --glow: #436FFF;
    --t1: rgba(255,255,255,.94); --t2: rgba(255,255,255,.62); --t3: rgba(255,255,255,.36);
    --stroke: rgba(255,255,255,.16); --stroke-hover: rgba(255,255,255,.24); --divider: rgba(255,255,255,.06);
    --fill-bar: rgba(255,255,255,.06); --fill-card: rgba(255,255,255,.03); --fill-row: rgba(255,255,255,.05);
    --fill-chip: rgba(255,255,255,.10); --fill-chip-p: rgba(255,255,255,.16);
    --link: #8CA8FF; --link-p: #ADC1FF; --quiet-blue: rgba(108,140,255,.78); --danger: #FF5C7A;
    --buy: #3DDC97; --wait: #FFB547; --fake: #FF5C7A;
    position: relative; width: 402px; height: 874px; background: var(--canvas); color: var(--t1);
    border-radius: 56px; overflow: hidden; box-shadow: 0 0 0 10px #17181b, 0 0 0 11px #34363b, 0 30px 60px rgba(0,0,0,.4);
    font-family: "HS", "Hiragino Sans", -apple-system, system-ui, sans-serif; font-weight: 400; line-height: 1;
    -webkit-font-smoothing: antialiased;
  }
  :where(.phone) button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
  :where(.phone) input { font: inherit; }
  .ell { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.3; margin: -2px 0; }

  /* Type roles (Typography.swift, iOS sizes). Hiragino sets at 1.0 line height; multi-line text adds spacing. */
  .t-title   { font-weight: 600; font-size: 28px; letter-spacing: -0.4px; }
  .t-card    { font-weight: 600; font-size: 16px; letter-spacing: -0.1px; }
  .t-body    { font-weight: 400; font-size: 16px; letter-spacing: 0; }
  .t-button  { font-weight: 500; font-size: 16px; letter-spacing: 0.2px; }
  .t-item    { font-weight: 400; font-size: 15px; letter-spacing: 0; }
  .t-label   { font-weight: 400; font-size: 14px; letter-spacing: 0.1px; }
  .t-caption { font-weight: 400; font-size: 13px; letter-spacing: 0.1px; }
  .t-small   { font-weight: 500; font-size: 13px; letter-spacing: 0.2px; }
  .t-section { font-weight: 400; font-size: 12px; letter-spacing: 0.3px; }
  .t-foot    { font-weight: 400; font-size: 12px; letter-spacing: 0.1px; }
  .multi     { line-height: calc(1em + 5px); }
  .c1 { color: var(--t1); } .c2 { color: var(--t2); } .c3 { color: var(--t3); }
  .num { font-variant-numeric: tabular-nums; }

  /* Gradient hairline helper: any element with .rim gets a 1pt top-lit border (set --r1/--r2/--rw). */
  .rim { position: relative; }
  .rim::after { content: ""; position: absolute; inset: 0; border-radius: inherit; padding: var(--rw, 1px); pointer-events: none;
    background: linear-gradient(to bottom, var(--r1, rgba(255,255,255,.12)), var(--r2, rgba(255,255,255,.05)));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; }

  /* Status bar, nav, layout */
  .status { position: absolute; top: 0; left: 0; right: 0; height: 54px; display: flex; justify-content: space-between;
    align-items: center; padding: 0 34px 0 48px; font: 600 17px/1 -apple-system, system-ui; z-index: 60; pointer-events: none; color: #fff; }
  .status .icons { display: flex; gap: 6px; align-items: center; }
  .screen { position: absolute; inset: 0; padding-top: 54px; display: flex; flex-direction: column; }
  .nav { position: relative; display: flex; align-items: center; justify-content: space-between; padding: 4px 16px 0; min-height: 48px; }
  .nav .inline-title { position: absolute; left: 0; right: 0; text-align: center; pointer-events: none; }
  .large-title { padding: 6px 16px 18px; }
  .scroll { flex: 1; overflow-y: auto; overflow-x: hidden; padding-bottom: 120px; }
  .scroll::-webkit-scrollbar { width: 0; }
  .pad { padding: 0 16px; }
  .stack { display: flex; flex-direction: column; }
  .hairline { height: 1px; background: var(--divider); }

  /* iOS 26 toolbar glass buttons (system-drawn: they stay system shapes) */
  .bar-btn { width: 44px; height: 44px; border-radius: 22px; display: flex; align-items: center; justify-content: center; color: var(--t1);
    background: rgba(255,255,255,.07); box-shadow: inset 0 0 0 .5px rgba(255,255,255,.14); backdrop-filter: blur(12px); }
  .bar-pill { height: 44px; padding: 0 18px; border-radius: 22px; display: flex; align-items: center; color: var(--t1);
    background: rgba(255,255,255,.07); box-shadow: inset 0 0 0 .5px rgba(255,255,255,.14); }

  /* ===== Keys (Keys.swift) ===== */
  .key { position: relative; display: block; width: 100%; height: 52px; padding-bottom: 2px; }
  .key .base { position: absolute; left: 0; right: 0; top: 2px; height: 50px; border-radius: 10px;
    background: linear-gradient(#0048CC, #00309A);
    box-shadow: 0 1px 2px rgba(0,0,0,.45), 0 4px 12px rgba(0,0,0,.3), 0 6px 24px rgba(0,94,255,.2);
    transition: box-shadow .3s cubic-bezier(.3,1.4,.5,1); }
  .key .face { position: absolute; left: 0; right: 0; top: 0; height: 50px; border-radius: 10px; overflow: hidden;
    display: flex; align-items: center; justify-content: center; color: #fff;
    background: linear-gradient(rgba(255,255,255,.1), rgba(255,255,255,0) 50%), linear-gradient(#2A78FF, #005EFF 50%, #0052E3);
    box-shadow: inset 1px 5px 5.4px #1B6FFF, inset 0 -1.5px 5px rgba(0,26,107,.32);
    transition: transform .3s cubic-bezier(.3,1.4,.5,1), box-shadow .3s; }
  .key .face span { font-weight: 500; font-size: 16px; letter-spacing: .2px; text-shadow: 0 1px 2px rgba(0,0,0,.22); white-space: nowrap; }
  .key:active .face { transform: translateY(2px); transition-duration: .07s; transition-timing-function: ease-out;
    box-shadow: inset 1px 5px 5.4px #1B6FFF, inset 0 -1.5px 5px rgba(0,26,107,.32), inset 0 2px 6px rgba(0,0,0,.36); }
  .key:active .base { box-shadow: 0 .5px 1px rgba(0,0,0,.45), 0 .5px 3px rgba(0,0,0,.18), 0 1px 8px rgba(0,94,255,.1); transition-duration: .07s; }
  .key[disabled] { opacity: .5; cursor: default; }
  .key.working .face span { opacity: 0; }

  .skey { position: relative; display: inline-block; height: 44px; padding: 3.25px 0; }
  .skey .base { position: absolute; left: 0; right: 0; top: 4.75px; height: 36px; border-radius: 8px; background: #111114; box-shadow: 0 2px 6px rgba(0,0,0,.55); }
  .skey .face { position: relative; height: 36px; padding: 0 14px; border-radius: 8px; display: flex; align-items: center; gap: 6px; color: var(--t1);
    background: linear-gradient(#34343A, #24242A); box-shadow: inset 0 1px 1.2px rgba(255,255,255,.14), inset 0 0 0 1px rgba(255,255,255,.06);
    transition: transform .3s cubic-bezier(.3,1.4,.5,1); }
  .skey .face span { font-weight: 500; font-size: 13px; letter-spacing: .2px; white-space: nowrap; }
  .skey:active .face { transform: translateY(1.5px); transition: transform .07s ease-out; }

  .quiet { position: relative; display: flex; width: 100%; height: 50px; border-radius: 10px; align-items: center; justify-content: center; gap: 8px;
    box-shadow: inset 0 0 0 1px var(--stroke); color: var(--t2); font-weight: 500; font-size: 16px; letter-spacing: .2px; transition: all .15s ease-out; }
  .quiet:active { box-shadow: inset 0 0 0 1px var(--stroke-hover); background: rgba(255,255,255,.04); color: var(--t1); }

  /* Spinner (WorkingIndicator) and dots (HoppingDots) and shimmer */
  .spin { animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .dots { display: inline-flex; gap: 4.5px; height: 14px; align-items: flex-end; padding: 0 2px 1px; }
  .dots i { width: 6px; height: 6px; border-radius: 3px; background: var(--dot, #fff); opacity: .4; animation: hop 1.2s infinite; }
  .dots i:nth-child(2) { animation-delay: .15s; } .dots i:nth-child(3) { animation-delay: .3s; }
  @keyframes hop { 0% { transform: translateY(0); opacity: .4; } 21% { transform: translateY(-3.5px); opacity: .9; } 42%, 100% { transform: translateY(0); opacity: .4; } }
  .shimmer { background: linear-gradient(100deg, var(--t2) 0 35%, rgba(255,255,255,.98) 50%, var(--t2) 65% 100%);
    background-size: 300% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: shim 1.8s linear infinite; }
  @keyframes shim { from { background-position: 100% 0; } to { background-position: 0 0; } }

  /* ===== Surfaces (Surfaces.swift, Glass.swift) ===== */
  .flat { position: relative; border-radius: 14px; background: var(--fill-card); box-shadow: 0 6px 24px rgba(0,0,0,.5); }
  .flat::after { content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1px; pointer-events: none;
    background: linear-gradient(rgba(255,255,255,.12), rgba(255,255,255,.05));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; }
  .flat .hairline { margin-left: 14px; }
  .flat .row-h { display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 14px; }
  .flat .row-h > :first-child { flex: 1; min-width: 0; }

  .glass { position: relative; border-radius: 20px; isolation: isolate; }
  .glass::before { content: ""; position: absolute; inset: 0; border-radius: inherit; z-index: -2;
    background: rgba(3,8,54,.3); filter: blur(15px); transform: translateY(9px); }
  .glass .frost { position: absolute; inset: 0; border-radius: inherit; z-index: -1; overflow: hidden;
    background: linear-gradient(rgba(255,255,255,.11), rgba(255,255,255,.035)), rgba(255,255,255,.08);
    backdrop-filter: blur(22px) saturate(150%); -webkit-backdrop-filter: blur(22px) saturate(150%); }
  .glass .frost::after { content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1px;
    background: linear-gradient(rgba(255,255,255,.4), rgba(255,255,255,.1));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; }

  /* BackdropGradient(.mesh): still light pooling in the lower half, dark at the top. */
  .backdrop { background:
      radial-gradient(70% 55% at 55% 100%, rgba(67,111,255,.95), rgba(67,111,255,0) 70%),
      radial-gradient(55% 45% at 0% 100%, rgba(0,94,255,.9), rgba(0,94,255,0) 75%),
      radial-gradient(50% 45% at 100% 100%, rgba(74,86,255,.9), rgba(74,86,255,0) 75%),
      radial-gradient(60% 40% at 60% 52%, rgba(74,86,255,.65), rgba(74,86,255,0) 75%),
      linear-gradient(to bottom, #010101 0%, #050318 22%, #1500FF 58%, #0A1BA8 72%, #005EFF 100%); }
  .backdrop.linear { background: linear-gradient(to bottom, #010101 0%, #1500FF 50%, #4A56FF 80%, #436FFF 100%); }

  /* Chips (Surfaces.swift Chip) */
  .chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; height: 44px; display: flex; align-items: center; }
  .chip > span { height: 32px; padding: 0 14px; border-radius: 16px; display: flex; align-items: center; gap: 6px;
    background: var(--fill-chip); color: var(--t2); font-size: 13px; letter-spacing: .1px; white-space: nowrap; transition: all .15s ease-out; }
  .chip:active > span { background: var(--fill-chip-p); color: var(--t1); }
  .chip.on > span { background: rgba(255,255,255,.22); color: var(--t1); box-shadow: inset 0 0 0 1px var(--stroke-hover); }

  /* Small round icon button (component L) */
  .icon-btn { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; flex: none; }
  .icon-btn > span { width: 32px; height: 32px; border-radius: 16px; display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,.07); box-shadow: inset 0 0 0 1px rgba(255,255,255,.12); color: rgba(255,255,255,.6); transition: transform .2s cubic-bezier(.3,1.5,.5,1); }
  .icon-btn:active > span { transform: scale(.9); background: rgba(255,255,255,.14); }
  .avatar { width: 38px; height: 38px; border-radius: 19px; flex: none; display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,.07); box-shadow: inset 0 0 0 1px rgba(255,255,255,.12); color: var(--t2); position: relative; }
  .vdot { width: 8px; height: 8px; border-radius: 4px; flex: none; }

  /* Outlined field (Fields.swift) */
  .field-label { margin-bottom: 9px; }
  .field { height: 44px; border-radius: 10px; box-shadow: inset 0 0 0 1px var(--stroke); display: flex; align-items: center; padding: 0 14px; }
  .field input { flex: 1; background: transparent; border: 0; outline: 0; color: var(--t1); font-size: 16px; caret-color: var(--glow); min-width: 0; }
  .field input::placeholder { color: var(--t3); }

  /* Tab bar (drawn by iOS 26: system glass) */
  .tabbar { position: absolute; left: 20px; right: 20px; bottom: 24px; display: flex; gap: 12px; align-items: center; z-index: 20; }
  .tabs { flex: 1; display: flex; justify-content: space-around; height: 62px; border-radius: 31px; padding: 4px;
    background: rgba(28,30,36,.62); backdrop-filter: blur(20px) saturate(160%); -webkit-backdrop-filter: blur(20px) saturate(160%);
    box-shadow: inset 0 0 0 .5px rgba(255,255,255,.16), 0 8px 24px rgba(0,0,0,.4); }
  .tab { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; border-radius: 27px;
    font: 600 10px/1 -apple-system, system-ui; color: rgba(255,255,255,.86); }
  .tab.on { color: var(--glow); background: rgba(255,255,255,.08); }
  .search-tab { width: 62px; height: 62px; border-radius: 31px; display: flex; align-items: center; justify-content: center; color: rgba(255,255,255,.86);
    background: rgba(28,30,36,.62); backdrop-filter: blur(20px) saturate(160%); -webkit-backdrop-filter: blur(20px) saturate(160%);
    box-shadow: inset 0 0 0 .5px rgba(255,255,255,.16), 0 8px 24px rgba(0,0,0,.4); }
  .search-tab.on { color: var(--glow); }
  .home-indicator { position: absolute; bottom: 8px; left: 50%; width: 140px; height: 5px; margin-left: -70px; background: #fff; border-radius: 3px; z-index: 70; opacity: .9; }

  /* Sheets (system-drawn shape) */
  .sheet { position: absolute; left: 0; right: 0; bottom: 0; top: 62px; background: var(--canvas); z-index: 25;
    border-top-left-radius: 38px; border-top-right-radius: 38px; box-shadow: 0 -.5px 0 rgba(255,255,255,.14);
    display: flex; flex-direction: column; transform: translateY(100%); transition: transform .4s cubic-bezier(.2,.85,.25,1); overflow: hidden; }
  .sheet.open { transform: translateY(0); }
  .sheet .grabber { width: 36px; height: 5px; border-radius: 3px; background: rgba(255,255,255,.28); margin: 6px auto 0; }
  .sheet .sheet-nav { display: flex; justify-content: space-between; align-items: center; padding: 6px 16px 6px; min-height: 56px; }
  .sheet .scroll { padding-bottom: 48px; }
  .scrim { position: absolute; inset: 0; background: rgba(0,0,0,.55); z-index: 24; opacity: 0; pointer-events: none; transition: opacity .3s; }
  .scrim.on { opacity: 1; pointer-events: auto; }

  /* Motion: rise in (Metrics.swift RiseEffect / Motion.rise) and card arrival */
  .rise { animation: rise .62s cubic-bezier(.3,1.25,.5,1) both; transform-origin: 50% 100%; }
  @keyframes rise { from { opacity: 0; transform: translateY(46px) scale(.92); } to { opacity: 1; transform: none; } }
  .arrive { animation: arrive .9s cubic-bezier(.25,1.15,.4,1) both; }
  @keyframes arrive { from { opacity: 0; transform: translateY(18px) scale(.92); filter: blur(8px); } to { opacity: 1; transform: none; filter: none; } }
  .pop { animation: pop .5s cubic-bezier(.3,1.6,.5,1) both; }
  @keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .freeze * { animation-delay: -10s !important; animation-play-state: paused !important; transition: none !important; }
  .freeze .dots i, .freeze .shimmer, .freeze .spin { animation-delay: 0s !important; }
  @media (prefers-reduced-motion: reduce) {
    .rise, .arrive, .pop, .shimmer, .island { animation: none !important; transition: none !important; }
    .shimmer { color: var(--t2); background: none; }
  }

  /* ===== ProductReportView ===== */
  .hero { position: relative; border-radius: 28px; overflow: hidden; box-shadow: 0 10px 56px rgba(5,11,94,.35); }
  .hero .backdrop { position: absolute; inset: 0; }
  .hero .inner { position: relative; padding: 16px 16px 16px; display: flex; flex-direction: column; gap: 14px; }
  .verdict-word { font-weight: 600; font-size: 40px; letter-spacing: -1.2px; white-space: nowrap; }
  .sample { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 9px; border-radius: 11px;
    background: rgba(255,255,255,.10); box-shadow: inset 0 0 0 .75px rgba(255,255,255,.22); color: var(--t1); font-size: 12px; letter-spacing: .1px; white-space: nowrap; }
  .meter { height: 4px; border-radius: 2px; background: rgba(255,255,255,.16); overflow: hidden; }
  .meter i { display: block; height: 100%; border-radius: 2px; background: rgba(255,255,255,.94); }
  .price-big { font-weight: 600; font-size: 34px; letter-spacing: -0.8px; }
  .kv { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .delta { font-size: 13px; letter-spacing: .1px; }

  /* ===== Dynamic Island + Live Activity (Widget/ScanLiveActivity.swift) ===== */
  .island { position: absolute; top: 11px; left: 50%; transform: translateX(-50%); width: 126px; height: 37px; background: #000;
    border-radius: 19px; z-index: 65; color: #fff; overflow: hidden; cursor: pointer;
    transition: width .5s cubic-bezier(.3,1.25,.45,1), height .5s cubic-bezier(.3,1.25,.45,1), border-radius .5s; }
  .island.compact { width: 250px; }
  .island.expanded { width: 380px; height: 160px; border-radius: 46px; }
  .island.expanded.short { height: 142px; }
  .island .compact-row { position: absolute; inset: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 14px 0 12px; }
  .island .expanded-body { position: absolute; inset: 0; padding: 20px 22px 18px; display: none; flex-direction: column; gap: 12px; }
  .island.expanded .compact-row { display: none; }
  .island.expanded .expanded-body { display: flex; }
  .la-top { display: flex; align-items: center; gap: 12px; }
  .la-pill { height: 24px; padding: 0 10px; border-radius: 12px; display: inline-flex; align-items: center; font-size: 12px; letter-spacing: .1px;
    background: rgba(255,255,255,.10); box-shadow: inset 0 0 0 .75px rgba(255,255,255,.22); color: rgba(255,255,255,.94); white-space: nowrap; }
  .la-x { margin-left: auto; width: 32px; height: 32px; border-radius: 16px; display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,.10); box-shadow: inset 0 0 0 1px rgba(255,255,255,.12); color: rgba(255,255,255,.7); flex: none; }
  .la-progress { height: 4px; border-radius: 2px; background: rgba(255,255,255,.14); position: relative; overflow: hidden; }
  .la-progress i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 2px; background: #436FFF; width: 0; }
  .la-progress i.run { transition: width 4s linear; width: 100%; }

  /* Lock Screen (outside the app) */

/* ---------- State ---------- */
const S = { tab: 'home', filter: 'All', newestFirst: true, needByDays: 30, tracked: {}, searchPage: null, homeEmpty: false };

/* ---------- PriceChartView ---------- */
function chart(r, accent) {
  const W = 340, H = 196, L = 40, R = 6, T = 20, B = 22;
  const start = new Date(TODAY); start.setUTCMonth(start.getUTCMonth() - 12);
  const past = r.history.map(p => ({ d: day(p.date), v: p.price })).filter(p => p.d >= start && p.d <= TODAY).sort((a, b) => a.d - b.d);
  past.push({ d: TODAY, v: r.currentPrice });
  const f = r.forecast;
  let future = f ? day(f.byDate) : null; if (!future || future <= TODAY) { future = new Date(TODAY); future.setUTCDate(future.getUTCDate() + 30); }
  const vals = past.map(p => p.v).concat(f ? [f.low, f.high] : [], r.typicalPrice ? [r.typicalPrice] : []);
  const lo = Math.min(...vals) * .9, hi = Math.max(Math.max(...vals) * 1.06, lo + 1);
  const x0 = start.getTime(), x1 = future.getTime();
  const X = d => L + (d.getTime() - x0) / (x1 - x0) * (W - L - R);
  const Y = v => T + (1 - (v - lo) / (hi - lo)) * (H - T - B);
  let g = '';
  const raw = (hi - lo) / 3, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const nice = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => (hi - lo) / s <= 4);
  for (let v = Math.ceil(lo / nice) * nice; v <= hi; v += nice) {
    g += `<line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" stroke="rgba(255,255,255,.06)"/>`;
    g += `<text x="${L - 8}" y="${Y(v) + 4}" text-anchor="end" font-size="11" fill="rgba(255,255,255,.36)">$${Math.round(v)}</text>`;
  }
  const m = new Date(Date.UTC(start.getUTCFullYear(), start.getUTCMonth() + 1, 1));
  for (let i = 0; m <= future; i++, m.setUTCMonth(m.getUTCMonth() + 1)) {
    if (i % 3) continue;
    g += `<text x="${X(m)}" y="${H - 5}" text-anchor="middle" font-size="11" fill="rgba(255,255,255,.36)">${m.toLocaleDateString('en-US', { month: 'short', timeZone: 'UTC' })}</text>`;
  }
  // Typical price: a quiet dashed rule with its label.
  if (r.typicalPrice) {
    g += `<line x1="${L}" x2="${W - R}" y1="${Y(r.typicalPrice)}" y2="${Y(r.typicalPrice)}" stroke="rgba(255,255,255,.36)" stroke-dasharray="2 4"/>`;
  }
  // Step line: price holds until it changes.
  let d = `M${X(past[0].d).toFixed(1)},${Y(past[0].v).toFixed(1)}`;
  for (let i = 1; i < past.length; i++) d += ` H${X(past[i].d).toFixed(1)} V${Y(past[i].v).toFixed(1)}`;
  const area = d + ` V${H - B} H${X(past[0].d).toFixed(1)} Z`;
  g += `<defs><linearGradient id="ar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#436FFF" stop-opacity=".28"/><stop offset="1" stop-color="#436FFF" stop-opacity="0"/></linearGradient></defs>`;
  g += `<path d="${area}" fill="url(#ar)"/>`;
  g += `<line x1="${X(TODAY)}" x2="${X(TODAY)}" y1="${T - 4}" y2="${H - B}" stroke="rgba(255,255,255,.36)" stroke-dasharray="3 3"/>`;
  g += `<text x="${X(TODAY)}" y="${T - 9}" text-anchor="middle" font-size="11" fill="rgba(255,255,255,.62)">Today</text>`;
  g += `<path d="${d}" fill="none" stroke="rgba(255,255,255,.94)" stroke-width="1.75" stroke-linejoin="round"/>`;
  // Lowest point.
  if (r.lowest && day(r.lowest.date) >= start) {
    const lx = X(day(r.lowest.date)), ly = Y(r.lowest.price);
    g += `<circle cx="${lx}" cy="${ly}" r="4" fill="#436FFF" stroke="#010101" stroke-width="1.5"/>`;
    g += `<text x="${Math.max(L + 18, lx)}" y="${ly + 17}" text-anchor="middle" font-size="11" fill="#8CA8FF">Low ${money(r.lowest.price)}</text>`;
  }
  // Forecast: a shaded range to the date, and a dashed line to its middle.
  if (f) {
    const mid = (f.low + f.high) / 2;
    g += `<path d="M${X(TODAY)},${Y(r.currentPrice)} L${X(future)},${Y(f.high)} L${X(future)},${Y(f.low)} Z" fill="${accent}" fill-opacity=".14"/>`;
    g += `<line x1="${X(TODAY)}" y1="${Y(r.currentPrice)}" x2="${X(future)}" y2="${Y(mid)}" stroke="${accent}" stroke-width="1.75" stroke-dasharray="4 4" stroke-linecap="round"/>`;
    g += `<circle cx="${X(future)}" cy="${Y(mid)}" r="3.5" fill="${accent}"/>`;
  }
  g += `<circle cx="${X(TODAY)}" cy="${Y(r.currentPrice)}" r="4.5" fill="#fff" stroke="#010101" stroke-width="1.5"/>`;
  return `<svg width="100%" viewBox="0 0 ${W} ${H}" role="img" aria-label="Price over the last 12 months, now ${money(r.currentPrice)}" style="display:block;font-family:inherit">${g}</svg>`;
}

/* ---------- ProductReportView ---------- */
function legend(accent, forecast) {
  const item = (mark, t) => `<span style="display:inline-flex;align-items:center;gap:6px">${mark}<span>${t}</span></span>`;
  const dash = (c, w = 14) => `<svg width="${w}" height="4"><line x1="0" x2="${w}" y1="2" y2="2" stroke="${c}" stroke-width="1.75" stroke-dasharray="3 3"/></svg>`;
  return `<div class="t-foot c2" style="display:flex;flex-wrap:wrap;gap:8px 14px;padding:10px 2px 0">
    ${item('<svg width="14" height="4"><line x1="0" x2="14" y1="2" y2="2" stroke="rgba(255,255,255,.94)" stroke-width="1.75"/></svg>', 'Price')}
    ${item(dash('rgba(255,255,255,.5)'), 'Typical')}
    ${item('<svg width="8" height="8"><circle cx="4" cy="4" r="4" fill="#436FFF"/></svg>', 'Lowest')}
    ${forecast ? item(dash(accent), 'Expected') : ''}</div>`;
}
function stars(rating) {
  let s = '';
  for (let i = 0; i < 5; i++) {
    const f = rating - i, id = 'h' + Math.random().toString(36).slice(2, 7);
    const fill = f >= .75 ? '#FFB547' : f >= .25 ? `url(#${id})` : 'none';
    s += `<svg width="12" height="12" viewBox="0 0 24 24"><defs><linearGradient id="${id}"><stop offset="50%" stop-color="#FFB547"/><stop offset="50%" stop-color="transparent"/></linearGradient></defs><path d="${I.star.match(/d="([^"]+)"/)[1]}" fill="${fill}" stroke="#FFB547" stroke-width="1.8" stroke-linejoin="round"/></svg>`;
  }
  return `<span style="display:inline-flex;gap:2px" aria-label="${rating.toFixed(1)} out of 5 stars">${s}</span>`;
}
function span(y) { return y < 1 ? `${Math.max(1, Math.round(y * 12))} months` : y < 1.5 ? 'a year' : `${Math.round(y)} years`; }
const sectionHead = t => `<div class="t-section c2" style="padding:0 4px 9px">${t}</div>`;
function verdictHero(r) {
  const st = style(r.verdict), pct = Math.round(r.confidence * 100);
  return `<!-- ProductReportView.verdictPanel: hero panel on BackdropGradient with a glass card -->
  <div class="hero arrive"><div class="backdrop"></div><div class="inner">
    <div style="display:flex;align-items:center;gap:8px">
      <span class="t-foot" style="color:rgba(255,255,255,.68)">Verdict</span>
      ${r.isSample ? `<span class="sample" style="margin-left:auto">${icon('sparkle', 11, '', 2)}Sample data</span>` : ''}
    </div>
    <div class="glass" style="padding:16px 18px 18px"><span class="frost"></span>
      <div style="display:flex;align-items:center;gap:12px">
        <span class="verdict-word pop" style="color:${st.color}">${st.word}</span>
        <span class="pop" style="margin-left:auto;color:${st.color};animation-delay:.12s">${icon(st.symbol, 34, '', 1.75)}</span>
      </div>
      <div class="t-body c1 multi" style="margin-top:12px">${r.oneLiner}</div>
      <div style="display:flex;align-items:center;gap:10px;margin-top:16px">
        <span class="t-foot" style="color:rgba(255,255,255,.68);white-space:nowrap">${pct}% sure</span>
        <span class="meter" style="flex:1"><i style="width:${pct}%"></i></span>
      </div>
    </div>
  </div></div>`;
}
function priceCard(r) {
  const vs = r.currentPrice - r.typicalPrice;
  const vsText = vs === 0 ? 'Same as typical' : `${money(Math.abs(vs))} ${vs > 0 ? 'above' : 'below'} typical`;
  const f = r.forecast;
  return `<!-- ProductReportView.prices -->
  <div class="flat" style="padding:16px 14px 6px">
    <div class="kv"><span class="t-label c2">Now at ${r.whereToBuy.retailer}</span>${r.wasPrice ? `<span class="t-caption c3" style="text-decoration:line-through">${money(r.wasPrice)}</span>` : ''}</div>
    <div class="kv" style="margin-top:10px;align-items:center">
      <span class="price-big num">${money(r.currentPrice)}</span>
      <span class="delta" style="color:${vs > 0 ? 'rgba(255,255,255,.62)' : '#3DDC97'}">${vsText}</span>
    </div>
    <div class="hairline" style="margin:16px -14px 0 0"></div>
    <div class="row-h" style="padding:0"><span class="t-item c2">Typical</span><span class="t-item c1 num">${money(r.typicalPrice)}</span></div>
    <div class="hairline" style="margin:0 -14px 0 0"></div>
    <div class="row-h" style="padding:0"><span class="t-item c2">Lowest</span><span class="t-item c1 num">${money(r.lowest.price)} <span class="c3 t-caption">· ${md(day(r.lowest.date))} · ${r.lowest.retailer}</span></span></div>
    ${f ? `<div class="hairline" style="margin:0 -14px 0 0"></div>
    <div class="row-h" style="padding:0"><span class="t-item c2">${f.event ? f.event : 'By ' + md(day(f.byDate))}</span>
      <span class="t-item num" style="display:flex;align-items:center;gap:4px;color:${style(r.verdict).color}">${icon(f.high < r.currentPrice ? 'downRight' : 'upRight', 14, '', 2.2)}${money(f.low)}–${money(f.high)}</span></div>` : ''}
  </div>`;
}
function reportBody(key, fromDiscover = false) {
  const r = REPORTS[key]; const st = style(r.verdict);
  const tracked = S.tracked[key];
  const chips = [['1 week', 7], ['2 weeks', 14], ['1 month', 30], ['3 months', 90]].map(([l, d]) => chip(l, S.needByDays === d, `data-needby="${d}"`)).join('');
  const alts = r.alternatives.length ? `<div>${sectionHead(r.verdict === 'CONSIDER_ALTERNATIVE' ? 'Better options' : 'Alternatives')}<div class="flat">${r.alternatives.map((a, i) => `
      ${i ? '<div class="hairline"></div>' : ''}<button class="row-h" style="width:100%;min-height:64px">
        <span style="display:flex;gap:12px;align-items:center;min-width:0"><span class="avatar">${icon(productIcon(a.name), 17)}</span>
          <span class="stack" style="gap:6px;min-width:0"><span class="t-item c1 ell">${a.name}</span>
          <span class="t-foot c2 ell">${a.note}</span></span></span>
        <span class="stack" style="align-items:flex-end;gap:6px;flex:none"><span class="t-item c1 num">${money(a.price)}</span><span class="t-foot ${a.price < r.currentPrice ? '' : 'c3'}" style="${a.price < r.currentPrice ? 'color:#3DDC97' : ''}">${a.price < r.currentPrice ? 'Save ' + money(r.currentPrice - a.price) : '+' + money(a.price - r.currentPrice)}</span></span>
      </button>`).join('')}</div></div>` : '';
  return `
  <div class="pad stack" style="gap:24px;padding-top:2px">
    <div class="stack" style="gap:8px;padding:0 4px">
      <div class="t-title">${r.product.name}</div>
      ${r.matchNote ? `<div class="t-foot c3">${r.matchNote}</div>` : `<div class="t-foot c3">${[r.product.brand, r.product.model].filter(Boolean).join(' · ')}</div>`}
    </div>
    ${verdictHero(r)}
    ${r.verdict === 'CONSIDER_ALTERNATIVE' ? alts : ''}
    ${priceCard(r)}
    <!-- ProductReportView.chart (PriceChartView) -->
    <div>${sectionHead('Last 12 months')}<div class="flat" style="padding:14px 14px 12px">${chart(r, st.color)}${legend(st.color, !!r.forecast)}</div></div>
    <!-- ProductReportView.facts -->
    <div>${sectionHead('Why')}<div class="flat">${r.facts.map(([ic, t], i) => `${i ? '<div class="hairline" style="margin-left:52px"></div>' : ''}
      <div class="row-h" style="gap:14px;min-height:50px"><span style="flex:none;color:rgba(255,255,255,.62);display:flex">${icon(ic, 18)}</span><span class="t-item c1 multi" style="flex:1;padding:12px 0">${t}</span></div>`).join('')}
      <div class="hairline" style="margin-left:52px"></div>
      <div class="row-h" style="gap:14px;min-height:50px"><span style="flex:none;color:rgba(255,255,255,.62);display:flex">${icon('tag', 18)}</span><span class="t-item c1" style="flex:1">${r.discount.label}</span></div>
    </div>
    <div class="t-foot c3 multi" style="padding:10px 4px 0">Searched ${r.sourcesChecked} sources and ${span(r.yearsOfData)} of prices.</div></div>
    ${r.verdict !== 'CONSIDER_ALTERNATIVE' ? alts : ''}
    <!-- ProductReportView.trackSection -->
    <div class="stack" style="gap:0">
      ${fromDiscover ? keyBtn('Check this for me', `data-check="${key}"`) : `
      ${sectionHead('Need it by')}
      <div class="chips" style="margin:-6px 0 12px">${chips}</div>
      ${keyBtn(tracked ? `${icon('check', 16, 'style="vertical-align:-3px;margin-right:6px"', 2.4)}Tracking daily` : 'Track until I need it', `data-track="${key}" ${tracked ? 'disabled' : ''}`)}`}
    </div>
    <!-- ProductReportView.storeSection -->
    <div class="stack" style="gap:12px">
      <div class="kv" style="padding:0 4px"><span class="t-label c2">Avg review</span><span style="display:flex;gap:8px;align-items:center">${stars(r.avgRating)}<span class="t-caption c2 num">${r.avgRating.toFixed(1)} · ${(r.reviewCount / 1000).toFixed(1)}k</span></span></div>
      <button class="quiet">${icon('link', 16)}Open on ${r.whereToBuy.retailer} · ${money(r.whereToBuy.totalCost)}</button>
    </div>
    <div style="height:8px"></div>
  </div>`;
}

/* ---------- ReportLoader: DiggingView and the error state ---------- */
function digging(withQuick) {
  const q = REPORTS.WAIT; const st = style(q.verdict);
  return `<div class="pad stack" style="gap:24px;padding-top:18px;min-height:640px">
    <div class="stack" style="gap:14px;padding:0 4px">
      ${dots()}
      <div class="t-title">${withQuick ? q.product.name : 'Digging'}</div>
      <div class="t-caption shimmer">${withQuick ? 'Reading two years of prices…' : 'Finding the product…'}</div>
    </div>
    ${withQuick ? `<div class="hero rise"><div class="backdrop"></div><div class="inner">
      <div style="display:flex;align-items:center;gap:8px"><span class="t-foot" style="color:rgba(255,255,255,.68)">Quick verdict</span>
        <span class="sample" style="margin-left:auto">${icon('sparkle', 11, '', 2)}Sample data</span></div>
      <div class="glass" style="padding:16px 18px 18px"><span class="frost"></span>
        <div style="display:flex;align-items:center;gap:12px"><span class="verdict-word pop" style="color:${st.color}">${st.word}</span>
          <span class="pop" style="margin-left:auto;color:${st.color}">${icon(st.symbol, 34)}</span></div>
        <div class="t-body c1 multi" style="margin-top:12px">${q.oneLiner}</div>
      </div>
      <div class="t-foot" style="color:rgba(255,255,255,.68);display:flex;align-items:center;gap:8px;padding:0 2px">${spinner(12, 'rgba(255,255,255,.68)')}Full report on its way</div>
    </div></div>` : ''}
  </div>`;
}
function errorView() {
  return `<div class="pad stack" style="align-items:center;text-align:center;gap:14px;padding-top:120px">
    <span style="color:rgba(255,255,255,.36)">${icon('magnify', 26, '', 1.5)}</span>
    <div class="t-card">Couldn't finish this check</div>
    <div class="t-caption c2 multi" style="max-width:260px">Try the product page or the exact model name.</div>
    <div style="margin-top:6px">${smallKey('Try again', 'data-state="digging"')}</div>
  </div>`;
}

  return `<div class="nav">${inline ? `<div class="inline-title t-card">${inline}</div>` : ''}
    ${leading ? `<button class="bar-btn" aria-label="Check a screenshot">${icon(leading, 20)}</button>` : '<span></span>'}
    <button class="bar-btn" data-state="settings" aria-label="Settings">${icon('gear', 20)}</button></div>`;
}
function homeScreen() {
  if (S.homeEmpty) {
    return `${navBar({ inline: 'Home', leading: 'photo' })}<div class="pad stack" style="align-items:center;text-align:center;gap:14px;padding-top:72px">
      <span style="color:rgba(255,255,255,.36)">${icon('hand', 26, '', 1.4)}</span>
      <div class="t-caption c2">Tap the back of your phone on any product.</div>
      <div style="margin-top:4px">${smallKey('Check a screenshot', '', 'photo')}</div></div>`;
  }
  return `${navBar({ inline: 'Home', leading: 'photo' })}<div class="scroll" style="padding-top:14px">${reportBody('WAIT')}</div>`;
}
function historyScreen() {
  const filt = HISTORY.filter(h => S.filter === 'All' || (S.filter === 'Tracking' && (h.saved || S.tracked[h.key]))
    || (S.filter === 'Buy' && h.verdict === 'BUY_NOW') || (S.filter === 'Wait' && h.verdict === 'WAIT') || (S.filter === 'Fake' && h.verdict === 'FAKE_DEAL'));
  const items = S.newestFirst ? filt : filt.slice().reverse();
  const isToday = t => new Date(t).toISOString().slice(0, 10) === TODAY.toISOString().slice(0, 10);
  const groups = [['Today', items.filter(h => isToday(h.created))], ['Last 7 days', items.filter(h => !isToday(h.created) && h.created >= now - 7 * 864e5)], ['Earlier', items.filter(h => h.created < now - 7 * 864e5)]]
    .filter(([, l]) => l.length);
  const time = t => { const d = new Date(t); return isToday(t) ? d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', timeZone: 'UTC' }) : md(d); };
  const rows = groups.map(([title, list]) => `<div style="margin-bottom:24px">${sectionHead(title)}<div class="flat">` + list.map((h, i) => {
    const st = style(h.verdict); const tracking = h.saved || S.tracked[h.key];
    return `${i ? '<div class="hairline" style="margin-left:64px"></div>' : ''}<div class="row-h" style="min-height:64px;gap:14px;padding:0 6px 0 12px">
      <button style="display:flex;gap:14px;align-items:center;flex:1;min-width:0" data-open="${h.key}">
        <span class="avatar">${icon(productIcon(h.name), 18)}</span>
        <span class="stack" style="gap:6px;min-width:0;flex:1">
          <span class="t-item c1 ell">${h.name}</span>
          <span class="t-foot c2" style="display:flex;align-items:center;gap:6px;white-space:nowrap"><span class="vdot" style="background:${st.color}"></span>${st.word}<span class="c3">· ${h.retailer} · ${money(h.price)}</span></span>
          ${tracking ? `<span class="t-foot" style="color:rgba(108,140,255,.78);display:flex;gap:5px;align-items:center">${icon('bell', 11, '', 2)}Daily until ${md(day(h.needBy || '2026-12-15'))}</span>` : ''}
          ${h.dropped ? `<span class="t-foot" style="color:#3DDC97">Dropped to ${money(h.price)}</span>` : ''}
        </span></button>
      <span class="stack" style="align-items:flex-end;gap:2px;flex:none"><span class="t-foot c3 num" style="padding-right:10px">${time(h.created)}</span><button class="icon-btn" style="height:30px;color:rgba(255,255,255,.36)" aria-label="More">${icon('dots', 18)}</button></span>
    </div>`;
  }).join('') + '</div></div>').join('');
  const chips = ['All', 'Tracking', 'Buy', 'Wait', 'Fake'].map(f => chip(f, S.filter === f, `data-filter="${f}"`)).join('');
  return `${navBar()}<div class="large-title t-title">History</div><div class="scroll"><div class="pad">
    <div style="display:flex;gap:4px;align-items:center;margin:-10px -4px 12px -6px">
      ${iconBtn('clock', 'data-sort', 'Sort')}
      <div class="chips">${chips}</div></div>
    ${rows || `<div class="stack" style="align-items:center;gap:14px;padding-top:72px"><span class="c3">${icon('clock', 22, '', 1.4)}</span><div class="t-caption c2">Nothing here yet.</div></div>`}</div></div>`;
}

    return `<div class="nav"><button class="bar-btn" data-back aria-label="Back">${icon('back', 20)}</button><div class="inline-title t-card">${S.listTitle}</div><span></span></div>

      <div class="scroll">${reportBody(S.discoverKey, true)}</div>`;
  }
  const row = (t, ic, sub, kind) => `<button class="row-h" style="width:100%;min-height:64px;gap:14px" data-list="${kind}" data-title="${t}">
      <span style="display:flex;gap:14px;align-items:center"><span class="avatar" style="color:#8CA8FF">${icon(ic, 18)}</span>
        <span class="t-item c1">${t}</span></span>
      <span class="c3">${icon('chev', 16, '', 2)}</span></button>`;
  return `${navBar()}<div class="large-title t-title">Search</div><div class="scroll"><div class="pad">
      ${sectionHead('Discover')}
      <div class="flat">${row('Lowest prices', 'down', '', 'lowest')}<div class="hairline" style="margin-left:64px"></div>${row('Best deals', 'tag', '', 'deals')}</div></div></div>
    ${S.askError ? `<div class="ask-error t-caption">Try the exact model name.</div>` : ''}
    <div class="askbar"><span class="shade"></span><span class="surface"></span>
      <input id="ask" placeholder="Ask about any product" aria-label="Ask about any product" value="${S.askText || ''}">
      ${S.asking ? `<span class="send">${spinner(17)}</span>` : S.askText ? `<button class="send" data-send aria-label="Ask">${icon('arrowUp', 20, '', 2.4)}</button>` : `<button class="send dim" data-mic aria-label="Ask by voice">${icon('mic', 20, '', 2)}</button>`}</div>`;
}
function accountScreen() {
  const stat = (l, v) => `<div class="row-h" style="min-height:56px"><span class="t-item c2">${l}</span><span class="t-card num" style="font-size:20px">${v}</span></div>`;
  return `${navBar()}<div class="large-title t-title">Account</div><div class="scroll"><div class="pad stack" style="gap:28px">
    <div><div class="t-label c2 field-label">Name</div><div class="field"><input placeholder="Your name" aria-label="Name"></div></div>
    <div class="flat">${stat('Checked', HISTORY.length)}<div class="hairline"></div>${stat('Tracking', HISTORY.filter(h => h.saved || S.tracked[h.key]).length)}</div>
    ${keyBtn('Upgrade to Pro')}
  </div></div>`;
}
function tabbar() {
  const t = (id, label, ic) => `<button class="tab ${S.tab === id ? 'on' : ''}" data-tab="${id}">${icon(ic, 24, '', 1.9)}<span>${label}</span></button>`;
  return `<div class="tabs">${t('home', 'Home', 'house')}${t('history', 'History', 'clock')}${t('account', 'Account', 'person')}</div>
    <button class="search-tab ${S.tab === 'search' ? 'on' : ''}" data-tab="search" aria-label="Search">${icon('search', 24, '', 2)}</button>`;
}

/* ---------- Render ---------- */
const $ = id => document.getElementById(id);
function render() {
  const screens = { home: homeScreen, history: historyScreen, search: searchScreen, account: accountScreen };
  $('screen').innerHTML = screens[S.tab]();
  $('tabbar').innerHTML = tabbar();
}
function openSheet(html, title = '') {
  $('sheet').innerHTML = `<div class="grabber"></div><div class="sheet-nav"><span class="t-card">${title}</span><button class="bar-pill t-button" data-close>Done</button></div><div class="scroll" id="sheetBody">${html}</div>`;
  $('sheet').classList.add('open'); $('scrim').classList.add('on');
}
function closeSheet() { $('sheet').classList.remove('open'); $('scrim').classList.remove('on'); S.sheetKey = null; }
let digTimer = null;
function openReport(key, dig = false) {
  closeStore(); clearTimeout(digTimer);
  if (dig) {
    openSheet(digging(false));
    digTimer = setTimeout(() => { if (!$('sheet').classList.contains('open')) return; $('sheetBody').innerHTML = digging(true);
      digTimer = setTimeout(() => { if ($('sheet').classList.contains('open')) $('sheetBody').innerHTML = reportBody(key); }, 3500); }, 2500);
  } else openSheet(reportBody(key));
  S.sheetKey = key;
}
function settings() {
  const item = (t, ic, blue) => `<div class="row-h" style="gap:14px;min-height:52px"><span style="display:flex;gap:14px;align-items:center"><span style="color:${blue ? '#8CA8FF' : 'rgba(255,255,255,.62)'};display:flex">${icon(ic, 18)}</span><span class="t-item ${blue ? '' : 'c1'}" style="${blue ? 'color:#8CA8FF' : ''}">${t}</span></span>${blue ? '' : `<span class="c3">${icon('chev', 14, '', 2)}</span>`}</div>`;
  openSheet(`<div class="pad stack" style="gap:24px;padding-top:4px">
    <div>${sectionHead('Set up once')}<div class="flat">${item('Add the shortcut', 'link', true)}<div class="hairline" style="margin-left:46px"></div>${item('Back Tap: Accessibility, Touch', 'hand')}<div class="hairline" style="margin-left:46px"></div>${item('Action Button', 'bolt')}</div></div>
    <div>${sectionHead('Notifications')}<div class="flat">${item('Test reminder', 'bell', true)}<div class="hairline" style="margin-left:46px"></div>${item('iPhone Settings', 'gear')}</div></div></div>`, 'Settings');
}

/* ---------- Back tap and Live Activity (Widget/ScanLiveActivity.swift) ---------- */
let laTimer = null, laState = 'off';
const LA = { verdict: 'WAIT' };
function storePage() {
  $('store').innerHTML = `<div class="sbar"><span style="color:#fff;font-weight:700">store</span><div class="sfield"></div></div>
    <div class="img">${icon('headphones', 120, 'style="color:#8a929e"', 1.2)}</div>
    <div class="info"><div style="font-size:18px;font-weight:600">AirPods Pro 3</div>
      <div><span style="font-size:26px;font-weight:600">$249</span></div>
      <div class="buy">Buy now</div><div class="cart">Add to cart</div></div>`;
  $('store').classList.add('on');
}
function closeStore() { $('store').classList.remove('on'); }
function laParts(state) {
  const r = REPORTS[LA.verdict]; const st = style(r.verdict);
  if (state === 'working') return { color: C.glow, symbol: 'radar', word: 'Digging…', headline: 'Finding the product…', name: null, working: true };
  if (state === 'failed') return { color: 'rgba(255,255,255,.62)', symbol: 'magnify', word: 'Tap to open', headline: 'Still digging. Tap to see your verdict.', name: null };
  return { color: st.color, symbol: 'dollar', word: st.word, headline: r.oneLiner, name: r.product.name, retailer: r.whereToBuy.retailer };
}
function island(state) {
  laState = state; const el = $('island');
  el.className = 'island'; el.innerHTML = '';
  if (state === 'off') return;
  const working = state.startsWith('working'), p = laParts(working ? 'working' : 'ready');
  el.classList.add(state.endsWith('expanded') ? 'expanded' : 'compact'); if (working) el.classList.add('short');
  el.innerHTML = `<div class="compact-row"><span style="color:${p.color};display:flex">${icon(p.symbol, 20, '', 2)}</span>
      <span class="t-small" style="color:${p.color}">${p.word}</span></div>
    <div class="expanded-body"><div class="la-top"><span style="color:${p.color};display:flex" class="${working ? '' : 'pop'}">${icon(p.symbol, 34, '', 1.8)}</span>
      <span class="stack" style="gap:6px;min-width:0"><span class="t-card" style="font-size:18px;color:${p.color}">${p.word}</span>
        <span class="t-foot" style="color:rgba(255,255,255,.62)">${p.name || 'Not Yet'}</span></span>
      ${working ? `<button class="la-x" data-cancel aria-label="Cancel">${icon('x', 14, '', 2.2)}</button>` : `<span class="la-pill" style="margin-left:auto">${p.retailer}</span>`}</div>
      <div class="t-label multi" style="color:rgba(255,255,255,.86)">${p.headline}</div>
      ${working ? '<div class="la-progress"><i id="prog"></i></div>' : ''}</div>`;
  if (state === 'working-expanded') requestAnimationFrame(() => { const pr = $('prog'); if (pr) { pr.style.width = (S.progressPct ?? 35) + '%'; requestAnimationFrame(() => pr.classList.add('run')); } });
}
function lockScreen(stage) {
  const el = $('lock');
  if (!stage) { el.classList.remove('on'); return; }
  const p = laParts(stage);
  el.innerHTML = `<div class="wall backdrop"></div>
    <div class="date">Sunday, November 15</div><div class="time">9:41</div>
    <div class="banner rise">
      <div style="display:flex;align-items:center;gap:10px"><span style="color:${p.color};display:flex">${icon(p.symbol, 28, '', 1.8)}</span>
        <span class="t-card" style="font-size:19px;color:#fff">${p.word}</span>
        ${p.retailer ? `<span class="la-pill">${p.retailer}</span>` : ''}
        ${p.working ? `<span class="la-x" style="margin-left:auto">${icon('x', 14, '', 2.2)}</span>` : ''}</div>
      <div class="t-label multi" style="color:rgba(255,255,255,.85)">${p.headline}</div>
      ${p.working ? '<div class="la-progress"><i style="width:40%"></i></div>' : ''}
    </div>`;
  el.classList.add('on');
}
function backTap() {
  clearTimeout(laTimer); closeSheet(); lockScreen(null); storePage(); island('working'); S.tapStart = Date.now();
  laTimer = setTimeout(() => { island('verdict-expanded'); laTimer = setTimeout(() => island('verdict'), 3000); }, 4000);
}

/* ---------- Named states (controls and ?state=) ---------- */
function reset() { clearTimeout(laTimer); clearTimeout(digTimer); closeSheet(); closeStore(); lockScreen(null); island('off'); S.searchPage = null; S.homeEmpty = false; S.askError = false; S.asking = false; S.askText = ''; }
function show(name) {
  reset();
  if (name.startsWith('report-')) { S.tab = 'history'; render(); return openReport(name.slice(7)); }
  if (name === 'digging' || name === 'digging-quick') { S.tab = 'home'; render(); openSheet(digging(name === 'digging-quick')); return; }
  if (name === 'error') { S.tab = 'home'; render(); openSheet(errorView()); return; }
  if (name === 'home-empty') { S.homeEmpty = true; S.tab = 'home'; return render(); }
  if (name === 'discover') { S.tab = 'search'; S.searchPage = 'list'; S.listTitle = 'Lowest prices'; return render(); }
  if (name === 'search-asking') { S.tab = 'search'; S.askText = 'Is the Dyson V15 a good deal?'; S.asking = true; return render(); }
  if (name === 'search-error') { S.tab = 'search'; S.askText = 'that vacuum'; S.askError = true; return render(); }
  if (name === 'settings') { render(); return settings(); }
  if (name.startsWith('island-')) { S.tab = 'home'; render(); storePage(); S.progressPct = 35; return island(name.slice(7)); }
  if (name.startsWith('lock-')) { return lockScreen(name.slice(5)); }
  if (['home', 'history', 'search', 'account'].includes(name)) { S.tab = name; return render(); }
}
window.preview = { show, reset, scrollTo: y => { const s = $('sheet').classList.contains('open') ? $('sheetBody') : $('screen').querySelector('.scroll'); if (s) s.scrollTop = y; } };

/* ---------- Events ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('button, [data-open], #island, #scrim'); if (!t) return;
  if (t.id === 'btnTap') return backTap();
  if (t.dataset.state) return show(t.dataset.state);
  if (t.id === 'scrim' || t.hasAttribute('data-close')) { clearTimeout(digTimer); return closeSheet(); }
  if (t.dataset.cancel !== undefined) { e.stopPropagation(); clearTimeout(laTimer); island('off'); return; }
  if (t.id === 'island') {
    if (laState === 'working') { S.progressPct = Math.min(100, (Date.now() - (S.tapStart || Date.now())) / 40); island('working-expanded'); return; }
    if (laState === 'working-expanded') { island('working'); return; }
    if (laState.startsWith('verdict')) { clearTimeout(laTimer); island('off'); closeStore(); S.tab = 'home'; render(); openReport(LA.verdict); }
    return;
  }
  if (t.dataset.open) { closeStore(); return openReport(t.dataset.open); }
  if (t.dataset.tab) { reset(); S.tab = t.dataset.tab; return render(); }
  if (t.dataset.filter) { S.filter = t.dataset.filter; return render(); }
  if (t.hasAttribute('data-sort')) { S.newestFirst = !S.newestFirst; return render(); }
  if (t.dataset.needby) { S.needByDays = +t.dataset.needby; rerenderReports(); return; }
  if (t.dataset.track) { S.tracked[t.dataset.track] = true; rerenderReports(); return; }
  if (t.dataset.check) { openReport(t.dataset.check, true); return; }
  if (t.dataset.list) { S.searchPage = 'list'; S.listTitle = t.dataset.title; return render(); }
  if (t.dataset.discover) { S.searchPage = 'report'; S.discoverKey = t.dataset.discover; return render(); }
  if (t.hasAttribute('data-back')) { S.searchPage = null; return render(); }
  if (t.hasAttribute('data-back-list')) { S.searchPage = 'list'; return render(); }
  if (t.hasAttribute('data-mic')) { S.askText = 'Is the Dyson V15 a good deal?'; return render(); }
  if (t.hasAttribute('data-send')) { return ask(); }
});
function ask() {
  S.asking = true; S.askText = $('ask')?.value || S.askText; render();
  setTimeout(() => { S.asking = false; S.askText = ''; render(); openReport('FAKE_DEAL', true); }, 1200);
}
document.addEventListener('input', e => {
  if (e.target.id === 'ask') { const had = !!S.askText; S.askText = e.target.value; if (had !== !!S.askText) { render(); const a = $('ask'); a.focus(); a.setSelectionRange(a.value.length, a.value.length); } }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'ask' && e.target.value.trim()) ask();
  if ((e.key === 'Enter' || e.key === ' ') && e.target.id === 'island') { e.preventDefault(); e.target.click(); }
  if (e.key === 'Escape') closeSheet();
});
function rerenderReports() {
  if ($('sheet').classList.contains('open') && S.sheetKey) { const top = $('sheetBody').scrollTop; $('sheetBody').innerHTML = reportBody(S.sheetKey); $('sheetBody').scrollTop = top; }
  if (S.tab === 'home') { const sc = $('screen').querySelector('.scroll'); const top = sc ? sc.scrollTop : 0; render(); const n = $('screen').querySelector('.scroll'); if (n) n.scrollTop = top; }
}

/* ---------- Fit the phone to the window ---------- */
const params = new URLSearchParams(location.search);
if (params.has('bare')) document.body.classList.add('bare');
function fit() {
  const bare = document.body.classList.contains('bare');
  const s = bare ? 1 : Math.min(1, (window.innerHeight - 40) / 894, (window.innerWidth - 40) / 422);
  $('phoneScale').style.transform = `scale(${s})`;
  $('phoneWrap').style.width = 402 * s + 'px'; $('phoneWrap').style.height = 874 * s + 'px';
}
window.addEventListener('resize', fit);
$('statusIcons').innerHTML = `<svg width="18" height="12" viewBox="0 0 18 12" fill="#fff" aria-hidden="true"><rect x="0" y="8" width="3" height="4" rx=".7"/><rect x="5" y="5" width="3" height="7" rx=".7"/><rect x="10" y="2" width="3" height="10" rx=".7"/><rect x="15" y="0" width="3" height="12" rx=".7"/></svg>
  <svg width="27" height="13" viewBox="0 0 27 13" aria-hidden="true"><rect x="0.5" y="0.5" width="23" height="12" rx="3.5" fill="none" stroke="rgba(255,255,255,.5)"/><rect x="2" y="2" width="18" height="9" rx="2" fill="#fff"/><rect x="24.5" y="4" width="2" height="5" rx="1" fill="rgba(255,255,255,.5)"/></svg>`;
render(); fit();
if (params.get('state')) show(params.get('state'));
</script>
</body>
</html>
