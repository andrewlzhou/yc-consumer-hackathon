name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Check documentation and session note
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 scripts/check_docs.py --base "$BASE_REF"

  # Add one job per module for its own lint and tests, for example:
